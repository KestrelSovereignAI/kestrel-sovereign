# LLM configuration for Kestrel — vendor/route/model architecture.
#
# A **vendor** is who makes the weights (openai, anthropic, ollama, ...).
# A **route** is how to reach them (base_url + auth + adapter). A vendor may
# have several routes (e.g. anthropic:api via API key, anthropic:plan via
# Claude Max OAuth). Discovery runs once per vendor; routing is per route.
#
# See docs/architecture/LLM_SERVICE_ARCHITECTURE.md for the canonical spec.

# Fallback order. Each entry is "<vendor>:<route>". The first available route
# is used unless a mandate specifies otherwise.
route_priority = [
    "anthropic:plan",
    "openai:plan",
    "openrouter:api",
    "anthropic:api",
    "openai:api",
    "vertex_ai:api",
    "llama_cpp:local",
    "ollama:local",
    "xai:api",
    "runpod:api",
    "groq:api",
]


# =============================================================================
# Anthropic
# =============================================================================

[vendors.anthropic]
is_cloud = true

[vendors.anthropic.routes.api]
# Metered API key billing.
adapter        = "AnthropicAdapter"
api_key_env    = "ANTHROPIC_API_KEY"
model          = "auto"
selection_hints = ["sonnet", "haiku", "opus"]

[vendors.anthropic.routes.plan]
# Claude Max subscription via OAuth token (from `claude setup-token`).
adapter        = "ClaudeMaxAdapter"
auth_token_env = "ANTHROPIC_AUTH_TOKEN"
model          = "auto"
selection_hints = ["sonnet", "opus"]


# =============================================================================
# OpenAI
# =============================================================================

[vendors.openai]
is_cloud = true

[vendors.openai.routes.api]
# Metered API key billing against api.openai.com.
adapter        = "OpenAIAdapter"
api_key_env    = "OPENAI_API_KEY"
model          = "auto"
selection_hints = ["gpt-5"]

[vendors.openai.routes.plan]
# ChatGPT subscription via OAuth token (from `codex login`).
adapter        = "CodexAdapter"
# Token auto-read from ~/.codex/auth.json, or from CODEX_AUTH_TOKEN env var.
auth_token_env = "CODEX_AUTH_TOKEN"
model          = "auto"
selection_hints = ["mini"]


# =============================================================================
# OpenRouter — meta-vendor aggregating many upstreams
# =============================================================================

[vendors.openrouter]
is_cloud = true

[vendors.openrouter.routes.api]
adapter        = "OpenRouterAdapter"
base_url       = "https://openrouter.ai/api/v1"
api_key_env    = "OPENROUTER_API_KEY"
model          = "auto"
selection_hints = ["deepseek", "chat"]


# =============================================================================
# Google Vertex AI / AI Studio (Gemini)
# =============================================================================

[vendors.vertex_ai]
is_cloud = true

[vendors.vertex_ai.routes.api]
adapter        = "VertexAIAdapter"
api_key_env    = "GOOGLE_API_KEY"
model          = "auto"
selection_hints = ["gemini", "pro", "flash"]


# =============================================================================
# Ollama — local or remote (via OLLAMA_HOST env var) tool-capable models
# =============================================================================

[vendors.ollama]
is_cloud = false

[vendors.ollama.routes.local]
adapter        = "OllamaAdapter"
# host = default; OLLAMA_HOST env var overrides (RunPod proxy, FRP tunnel, etc.)
host           = "http://localhost:11434"
model          = "auto"
selection_hints = ["latest", "qwen"]


# =============================================================================
# llama.cpp — local OpenAI-compatible server (start with ~/models/start-kimi.sh)
# =============================================================================

[vendors.llama_cpp]
is_cloud = false

[vendors.llama_cpp.routes.local]
adapter        = "OpenAIAdapter"
base_url       = "http://localhost:8001/v1"
local          = true
model          = "auto"
# context_limit auto-detected from /props; override only if detection fails.
# context_limit = 131072


# =============================================================================
# Other OpenAI-compatible remote providers
# =============================================================================

[vendors.xai]
is_cloud = true

[vendors.xai.routes.api]
adapter        = "OpenAIAdapter"
base_url       = "https://api.x.ai/v1"
api_key_env    = "XAI_API_KEY"
model          = "auto"
selection_hints = ["fast", "grok"]


[vendors.runpod]
is_cloud = true

[vendors.runpod.routes.api]
adapter        = "OpenAIAdapter"
base_url       = "https://api.runpod.ai/v2/vllm-2f8vdgn/openai/v1"
api_key_env    = "RUNPOD_API_KEY"
model          = "auto"
selection_hints = ["llama", "instruct"]


[vendors.groq]
is_cloud = true

[vendors.groq.routes.api]
adapter        = "OpenAIAdapter"
base_url       = "https://api.groq.com/openai/v1"
api_key_env    = "GROQ_API_KEY"
model          = "auto"
selection_hints = ["versatile", "llama"]
