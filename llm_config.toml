# LLM provider configuration for Kestrel.
#
# 1. Copy this file to "llm_config.toml" if it doesn't exist.
# 2. The 'provider_priority' list determines the fallback order.
# 3. For OpenAI, set the OPENAI_API_KEY environment variable.

provider_priority = ["openrouter", "llama_cpp", "ollama", "claude_plan", "openai_plan", "openai", "openai_mini", "anthropic", "vertex_ai", "runpod", "xai"]

# Claude plan - Use your Claude subscription session for API access
# Requires: pip install claude-agent-sdk && claude login
# This uses subscription authentication, not API key billing
[claude_plan]
model = "auto"
selection_hints = ["sonnet", "opus"]  # Prefer Sonnet family, then Opus, from discovery/cache

# OpenAI plan - Use your ChatGPT/OpenAI plan session for API access via OAuth
# Requires: codex login (OAuth authentication, stores token in ~/.codex/auth.json)
# This uses subscription authentication, not API key billing
[openai_plan]
model = "auto"
selection_hints = ["gpt-5.4", "mini"]

# OpenRouter - Primary provider with crypto payments (agents can fund themselves)
# Supports: ETH (chain_id=1), Polygon (137), Base (8453)
# Crypto API: POST /api/v1/credits/coinbase {amount, sender, chain_id}
# Models: deepseek-r1 $0.30/$1.20, llama-3.3-70b $0.10/$0.32, claude-3.5-sonnet $6/$30
# Uses dedicated OpenRouterAdapter with proper model discovery
[openrouter]
type = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
model = "auto"
selection_hints = ["deepseek", "chat"]  # Prefer the configured family from discovery/cache

# OpenAI (cloud) - Primary provider for GPT-5.1
[openai]
model = "auto"
selection_hints = ["gpt-5"]  # Prefer GPT-5 family from discovery/cache

# OpenAI mini model for auditing (lower cost, fast)
[openai_mini]
type = "openai_compatible"
base_url = "https://api.openai.com/v1"
model = "auto"
selection_hints = ["mini", "gpt-5"]  # Prefer mini/cheap GPT-5 family from discovery/cache
api_key_env = "OPENAI_API_KEY"

# Anthropic (Claude) - Constitutional reviewer and complex reasoning
[anthropic]
model = "auto"
selection_hints = ["sonnet", "haiku", "opus"]  # Prefer Sonnet family from discovery/cache
api_key_env = "ANTHROPIC_API_KEY"

# Vertex AI / Google AI Studio (Gemini) - Uses GOOGLE_API_KEY
[vertex_ai]
model = "auto"
selection_hints = ["gemini", "pro", "flash"]  # Prefer Gemini Pro family, then Flash, from discovery/cache

# RunPod (OpenAI-compatible) - Alternative cloud provider
[runpod]
type = "openai_compatible"
base_url = "https://api.runpod.ai/v2/vllm-2f8vdgn/openai/v1"
model = "auto"
selection_hints = ["llama", "instruct"]  # Prefer chat/instruct models from discovery/cache
api_key_env = "RUNPOD_API_KEY"

# llama.cpp - Local server (start with ~/models/start-kimi.sh)
# Model discovery via /v1/models endpoint; context_limit auto-detected from /props
[llama_cpp]
type = "openai_compatible"
base_url = "http://localhost:8001/v1"
local = true  # No API key required
model = "auto"
# context_limit = 131072  # Override if auto-detection fails

# Ollama - Privacy mode and local/cloud GPU fallback
# Host is configured via OLLAMA_HOST env var:
#   Local dev:  http://localhost:11434 (default)
#   Cloud Run:  https://1wj2bh67ppdimv-11434.proxy.runpod.net (RunPod RTX 4090)
# Available models on cloud: deepseek-r1:14b, phi4, qwen2.5:14b
[ollama]
host = "http://localhost:11434"  # Overridden by OLLAMA_HOST env var
model = "auto"
selection_hints = ["latest", "llama3.2", "qwen"]  # Prefer tool-capable local models from discovery/cache

[xai]
type = "openai_compatible"
base_url = "https://api.x.ai/v1"
model = "auto"
selection_hints = ["fast", "grok"]  # Prefer fast chat models from discovery/cache
api_key_env = "XAI_API_KEY"

#[azure_openai]
#type = "openai_compatible"
#base_url = "https://YOUR_RESOURCE.openai.azure.com"
#model = "gpt-5"
#api_key_env = "AZURE_OPENAI_API_KEY"

[groq]
type = "openai_compatible"
base_url = "https://api.groq.com/openai/v1"
model = "auto"
selection_hints = ["versatile", "llama"]  # Prefer versatile chat models from discovery/cache
api_key_env = "GROQ_API_KEY"

