[project]
name = "kestrel-feature-code"
version = "0.1.0"
description = "Agent self-modification with constitutional approval for Kestrel Sovereign"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kestrel-sovereign-sdk @ git+https://github.com/KestrelSovereignAI/kestrel-sovereign-sdk.git",
]

[project.entry-points."kestrel_sovereign.features"]
CodeEditFeature = "kestrel_feature_code.feature:CodeEditFeature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["kestrel_feature_code"]
