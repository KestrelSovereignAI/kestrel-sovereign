[project]
name = "kestrel-feature-code"
version = "0.1.0"
description = "Agent self-modification with constitutional approval for Kestrel Sovereign"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Framework dependency (provides Feature, Hook, ToolCategory, etc.)
    # When installed standalone, this pulls in kestrel-sovereign.
    # When co-located in the monorepo, kestrel-sovereign is already available.
    "kestrel_sovereign",
]

[project.entry-points."kestrel_sovereign.features"]
CodeEditFeature = "kestrel_feature_code.feature:CodeEditFeature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["kestrel_feature_code"]
