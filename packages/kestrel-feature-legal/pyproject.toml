[project]
name = "kestrel-feature-legal"
version = "0.1.0"
description = "Kestrel Wyoming DAO LLC feature"
requires-python = ">=3.11"
dependencies = [
    "kestrel-sovereign-sdk @ git+https://github.com/KestrelSovereignAI/kestrel-sovereign-sdk.git",
]

[project.entry-points."kestrel_sovereign.features"]
LegalFeature = "kestrel_feature_legal:LegalFeature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["kestrel_feature_legal"]
