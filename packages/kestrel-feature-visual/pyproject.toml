[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "kestrel-feature-visual"
version = "0.1.0"
description = "Kestrel feature: visual identity — avatar generation, selfies, LoRA training"
requires-python = ">=3.11"
dependencies = [
    "kestrel-sovereign-sdk",
    # Cross-feature: features.training (not in SDK)
    "kestrel-sovereign",
    "replicate>=1.0.4",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Cross-feature deps (optional, try/except guarded at runtime)
training = ["kestrel-sovereign"]
test = ["pytest", "pytest-asyncio"]

[project.entry-points."kestrel_sovereign.features"]
VisualIdentityFeature = "kestrel_feature_visual.feature:VisualIdentityFeature"

[tool.setuptools.packages.find]
where = ["src"]
