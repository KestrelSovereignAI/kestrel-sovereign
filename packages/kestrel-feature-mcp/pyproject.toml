[project]
name = "kestrel-feature-mcp"
version = "0.1.0"
description = "Kestrel Feature: Model Context Protocol (MCP) server management and tool bridging"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "kestrel-sovereign-sdk",
    "docker>=7.1.0",
    "mcp>=1.26.0",
    "trio>=0.32.0",
    "aiohttp>=3.13.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.1.0",
    "pytest-timeout>=2.3.1",
]

[project.entry-points."kestrel_sovereign.features"]
MCPAgent = "kestrel_feature_mcp.feature:MCPAgent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kestrel_feature_mcp"]

[tool.uv.sources]
kestrel-sovereign-sdk = { workspace = true }
