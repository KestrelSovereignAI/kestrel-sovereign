name: Refresh Repo Map

# Regenerates docs/audit/REPO_MAP.md — the always-on context the kestrel-agent
# GitHub App reads to know what files exist and what they do (see issue #791).

on:
  schedule:
    - cron: "17 6 * * *"  # 06:17 UTC daily — off-hours, off-the-hour to avoid cron pile-up
  pull_request:
    branches: [main]
    paths:
      - "scripts/generate_repo_map.py"
      - ".github/workflows/repo-map.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # We need to push back, so use a token with write access
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Regenerate REPO_MAP.md
        run: python scripts/generate_repo_map.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet docs/audit/REPO_MAP.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "REPO_MAP.md unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "REPO_MAP.md changed; preparing commit."
            git diff --stat docs/audit/REPO_MAP.md
          fi

      - name: Commit & push (scheduled / manual runs only)
        if: steps.diff.outputs.changed == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "kestrel-agent[bot]"
          git config user.email "kestrel-agent[bot]@users.noreply.github.com"
          git add docs/audit/REPO_MAP.md
          git commit -m "chore(repo-map): nightly regeneration

          Auto-refresh of docs/audit/REPO_MAP.md so the kestrel-agent GitHub App's
          always-on context reflects the current tree."
          git push

      - name: Fail PR if REPO_MAP.md is stale
        if: steps.diff.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          echo "::error file=docs/audit/REPO_MAP.md::REPO_MAP.md is stale. Run: python scripts/generate_repo_map.py"
          exit 1
