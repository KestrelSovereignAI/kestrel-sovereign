name: Kestrel CI

on:
  push:
    branches:
      - 'main'     # Run on main pushes — lint-and-imports only (see `if:` on heavier jobs)
      - 'issue-*'  # Run on kestrel-talon feature branches
  pull_request:
    branches: [main, 'epic/**']  # Run on PRs targeting main and epic branches
  workflow_dispatch:  # Manual trigger
    inputs:
      workflow_cassette_mode:
        description: "Workflow cassette mode. Use record only for manually approved first-cassette bootstrap."
        required: true
        type: choice
        default: replay
        options:
          - replay
          - record
      workflow_cassette_owner_did:
        description: "Owner DID bound into the encrypted cassette AAD."
        required: false
        type: string
      workflow_cassette_id:
        description: "Stable cassette id, for example red-team/review-1."
        required: false
        type: string
      workflow_cassette_operator_did:
        description: "Operator DID authorizing record mode."
        required: false
        type: string
      workflow_cassette_operator_signature:
        description: "Hex ECDSA signature over scripts/workflow_cassette_ci.py approval-payload."
        required: false
        type: string
  workflow_call:      # Callable as a reusable workflow — publish.yml invokes this on
                      # tag pushes via its `ci` gate job. The direct tag trigger was
                      # removed so a tag push results in exactly ONE CI run (nested
                      # inside publish.yml), not two.

env:
  PYTHON_VERSION: "3.13"
  KESTREL_AUDIT_MODE: "skip"  # Skip audit in CI
  # Stabilize parametrize ordering across xdist workers. Some test sources
  # iterate frozensets / dicts whose ordering depends on PYTHONHASHSEED;
  # without this pin, workers see different parametrize orderings and
  # xdist refuses to run with "Different tests were collected between gw…".
  PYTHONHASHSEED: "0"

jobs:
  # Fast checks first
  lint-and-imports:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.workflow_cassette_mode != 'record'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Validate imports
        run: uv run python run_tests.py --kestrel --skip-check --validate-only
        timeout-minutes: 5

  # Unit tests (no services needed)
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-imports
    if: github.event_name != 'workflow_dispatch' || inputs.workflow_cassette_mode != 'record'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        # ``-n auto`` parallelizes across runner cores via pytest-xdist
        # (already a dev dep). Local benchmark on the unit suite: ~5 min
        # serial → ~45 sec under -n auto on a 16-core runner. The
        # PYTHONHASHSEED env at the workflow level keeps parametrize
        # ordering deterministic across workers.
        run: uv run pytest tests/unit/ -n auto -v --tb=short -x --timeout=60
        timeout-minutes: 10
        env:
          KESTREL_AUDIT_MODE: skip

  # Integration tests (with services)
  # Skipped on main-branch pushes — by then the PR that landed this code
  # already ran integration-tests against the merge commit. Re-running on
  # the squash-merge adds cost without new signal. The integration +
  # llm-tests suite is also the heaviest (services, GPUs, API credits),
  # more suited to local verification and special cases. See #682.
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: >-
      (github.event_name != 'push' || github.ref != 'refs/heads/main') &&
      (github.event_name != 'workflow_dispatch' || inputs.workflow_cassette_mode != 'record')
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: kestrel_user
          POSTGRES_PASSWORD: kestrel_password
          POSTGRES_DB: kestrel
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://kestrel_user:kestrel_password@localhost:5433/kestrel
      REDIS_URL: redis://localhost:6380
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run integration tests
        # NOT parallelized: integration tests share a single Postgres
        # database and Redis instance, and most don't isolate state per-test.
        # A follow-up PR can introduce per-worker schemas / databases and
        # add ``-n auto`` here once the isolation work is done.
        run: uv run pytest tests/integration/ -v --tb=short -x --timeout=120 -m "not docker_mcp and not cloud_resource"
        timeout-minutes: 20
        env:
          KESTREL_AUDIT_MODE: skip
          KESTREL_DATA_KEY: "ci-test-encryption-key-32-chars!!"
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_PAT: ${{ secrets.GH_PAT }}

  # LLM integration tests (require API keys)
  llm-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name != 'workflow_dispatch' || inputs.workflow_cassette_mode != 'record'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run LLM tests
        run: uv run pytest tests/llm/ -v --tb=short -x --timeout=120
        timeout-minutes: 15
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}

  workflow-cassette-record-bootstrap:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.workflow_cassette_mode == 'record'
    environment: workflow-cassette-recording
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group test

      - name: Validate operator record gate
        run: uv run python scripts/workflow_cassette_ci.py validate-record-gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          KESTREL_WORKFLOW_CASSETTE_SECRET_STORE: approved
          KESTREL_WORKFLOW_CASSETTE_TRUSTED_REF: refs/heads/main
          KESTREL_WORKFLOW_CASSETTE_OPERATOR_PUBLIC_KEY_HEX: ${{ secrets.KESTREL_WORKFLOW_CASSETTE_OPERATOR_PUBLIC_KEY_HEX }}
          WORKFLOW_CASSETTE_OPERATOR_DID: ${{ inputs.workflow_cassette_operator_did }}
          WORKFLOW_CASSETTE_OPERATOR_SIGNATURE: ${{ inputs.workflow_cassette_operator_signature }}
          WORKFLOW_CASSETTE_OWNER_DID: ${{ inputs.workflow_cassette_owner_did }}
          WORKFLOW_CASSETTE_ID: ${{ inputs.workflow_cassette_id }}

      - name: Encrypt recorded cassette payload
        run: |
          test -n "$KESTREL_WORKFLOW_CASSETTE_RECORD_PAYLOAD_B64"
          mkdir -p "$RUNNER_TEMP/workflow-cassette" tests/cassettes
          printf '%s' "$KESTREL_WORKFLOW_CASSETTE_RECORD_PAYLOAD_B64" | base64 --decode > "$RUNNER_TEMP/workflow-cassette/payload.json"
          uv run python scripts/workflow_cassette_ci.py encrypt \
            --payload-file "$RUNNER_TEMP/workflow-cassette/payload.json" \
            --output-dir tests/cassettes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          KESTREL_WORKFLOW_CASSETTE_SECRET_STORE: approved
          KESTREL_WORKFLOW_CASSETTE_KEY: ${{ secrets.KESTREL_WORKFLOW_CASSETTE_KEY }}
          KESTREL_WORKFLOW_CASSETTE_RETENTION_SECONDS: "7776000"
          KESTREL_WORKFLOW_CASSETTE_TRUSTED_REF: refs/heads/main
          KESTREL_WORKFLOW_CASSETTE_OPERATOR_PUBLIC_KEY_HEX: ${{ secrets.KESTREL_WORKFLOW_CASSETTE_OPERATOR_PUBLIC_KEY_HEX }}
          KESTREL_WORKFLOW_CASSETTE_RECORD_PAYLOAD_B64: ${{ secrets.KESTREL_WORKFLOW_CASSETTE_RECORD_PAYLOAD_B64 }}
          WORKFLOW_CASSETTE_OPERATOR_DID: ${{ inputs.workflow_cassette_operator_did }}
          WORKFLOW_CASSETTE_OPERATOR_SIGNATURE: ${{ inputs.workflow_cassette_operator_signature }}
          WORKFLOW_CASSETTE_OWNER_DID: ${{ inputs.workflow_cassette_owner_did }}
          WORKFLOW_CASSETTE_ID: ${{ inputs.workflow_cassette_id }}

      - name: Upload encrypted cassette artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workflow-cassette-recording
          path: tests/cassettes/*.workflow-cassette.enc
          if-no-files-found: error
