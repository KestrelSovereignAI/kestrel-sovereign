name: Kestrel CI

on:
  push:
    branches:
      - 'main'     # Run on main pushes — lint-and-imports only (see `if:` on heavier jobs)
      - 'issue-*'  # Run on kestrel-talon feature branches
  pull_request:
    branches: [main, 'epic/**']  # Run on PRs targeting main and epic branches
  workflow_dispatch:  # Manual trigger
  workflow_call:      # Callable as a reusable workflow — publish.yml invokes this on
                      # tag pushes via its `ci` gate job. The direct tag trigger was
                      # removed so a tag push results in exactly ONE CI run (nested
                      # inside publish.yml), not two.
    inputs:
      ref:
        description: >-
          Git ref/SHA to check out. publish.yml passes the release ref so this
          gate validates the EXACT SHA being published (not the branch the
          publish was dispatched from). Empty for every other trigger, where
          each checkout below falls back to its default event ref.
        required: false
        type: string

# Supersede an in-flight PR run when a newer commit lands on the same ref —
# the dominant source of wasted runs during churn. Scoped to pull_request
# only, so main pushes and the publish.yml release gate never get cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  KESTREL_AUDIT_MODE: "skip"  # Skip audit in CI
  # Stabilize parametrize ordering across xdist workers. Some test sources
  # iterate frozensets / dicts whose ordering depends on PYTHONHASHSEED;
  # without this pin, workers see different parametrize orderings and
  # xdist refuses to run with "Different tests were collected between gw…".
  PYTHONHASHSEED: "0"

jobs:
  # Once the default branch is clean, reject any PR that introduces a new
  # high/critical dependency advisory. The action compares the base and head
  # dependency snapshots, so intentional lower-severity exceptions remain an
  # explicit review decision instead of a blanket suppression.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reject new high-severity dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Fast checks first
  lint-and-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}  # release SHA when called from publish.yml; default ref otherwise

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }} 3.11

      - name: Validate minimum-version Python syntax
        run: uv run --no-project --python 3.11 python -m compileall -q kestrel_sovereign

      - name: Install dependencies
        run: uv sync

      - name: Validate imports
        run: uv run python run_tests.py --kestrel --skip-check --validate-only
        timeout-minutes: 5

  # Unit tests (no services needed)
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-imports
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}  # release SHA when called from publish.yml; default ref otherwise

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        # ``-n auto`` parallelizes across runner cores via pytest-xdist
        # (already a dev dep). Note that ``auto`` resolves to **2 workers**
        # on the standard GitHub-hosted runner, not the 16 an earlier
        # revision of this comment assumed — 12.4k tests land at ~8 min.
        # Runner sizing is tracked in #2795. The PYTHONHASHSEED env at the
        # workflow level keeps parametrize ordering deterministic across
        # workers.
        #
        # ``-m "not bench"`` makes the marker description in pyproject.toml
        # ("Performance benchmarks (excluded from default CI)") true. It had
        # never been wired up, so every benchmark ran on every PR.
        run: uv run pytest tests/unit/ -n auto -v --tb=short -x --timeout=60 -m "not bench"
        timeout-minutes: 10
        env:
          KESTREL_AUDIT_MODE: skip

      - name: Run voice playback JavaScript tests
        run: >-
          node --test
          tests/js/test_voice_playback.mjs
          tests/js/test_voice_playback_worklet.mjs

  python-314-install-check:
    runs-on: ubuntu-latest
    needs: lint-and-imports
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}  # release SHA when called from publish.yml; default ref otherwise

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Clean install + import smoke test
        run: |
          uv venv --python 3.14 .venv-py314
          . .venv-py314/bin/activate
          uv pip install .
          python -c "
          import kestrel_sovereign
          from kestrel_sdk.signals.models import Signal
          import tiktoken
          print('Kestrel imports OK on Python 3.14')
          "

  # Integration tests (with services)
  # Skipped on main-branch pushes — by then the PR that landed this code
  # already ran integration-tests against the merge commit. Re-running on
  # the squash-merge adds cost without new signal. The integration +
  # llm-tests suite is also the heaviest (services, GPUs, API credits),
  # more suited to local verification and special cases. See #682.
  #
  # Depends on lint-and-imports, NOT unit-tests. Chaining the test tiers
  # end-to-end serialized the whole workflow and cost ~8 min of wall clock
  # per PR (22 min total, of which nothing overlapped). The chain existed
  # as a cost gate — don't burn an integration runner when the unit tier is
  # already red — but this repo is public, so Linux minutes are free, and
  # the `concurrency:` block above already cancels superseded PR runs, which
  # was the dominant source of waste. See #2793.
  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-and-imports
    if: >-
      github.event_name != 'push' || github.ref != 'refs/heads/main'
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: kestrel_user
          POSTGRES_PASSWORD: kestrel_password
          POSTGRES_DB: kestrel
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://kestrel_user:kestrel_password@localhost:5433/kestrel
      REDIS_URL: redis://localhost:6380
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}  # release SHA when called from publish.yml; default ref otherwise

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run integration tests
        # NOT parallelized: integration tests share a single Postgres
        # database and Redis instance. Measured scope of that sharing is
        # narrower than it looks — 157 of 1245 tests, in 9 files — so the
        # per-worker-database work needed to add ``-n auto`` here is
        # tractable. Tracked in #2794.
        run: uv run pytest tests/integration/ -v --tb=short -x --timeout=120 -m "not docker_mcp and not cloud_resource and not bench"
        timeout-minutes: 20
        env:
          KESTREL_AUDIT_MODE: skip
          KESTREL_SKIP_REACHABILITY_PROBE: "1"
          KESTREL_DATA_KEY: "ci-test-encryption-key-32-chars!!"
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_PAT: ${{ secrets.GH_PAT }}

  # LLM integration tests (require API keys)
  #
  # The `if:` below is load-bearing and must stay in sync with
  # integration-tests. This job used to declare `needs: integration-tests`,
  # and was skipped on main-branch pushes only as a *side effect* — a job
  # whose dependency is skipped is itself skipped. Now that it depends on
  # lint-and-imports instead (#2793), that condition has to be stated
  # outright, or this job would start running on main pushes, which is a
  # behavior change nobody asked for.
  #
  # Running in parallel with the other tiers means this job no longer waits
  # ~21 minutes to do ~10 seconds of work. It can now run when the unit tier
  # is red; the API-credit cost of that is negligible, because the tests
  # that call live providers are all behind the `live` marker or a
  # credential skipif, and skip when the key is absent.
  llm-tests:
    runs-on: ubuntu-latest
    needs: lint-and-imports
    if: >-
      github.event_name != 'push' || github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}  # release SHA when called from publish.yml; default ref otherwise

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run LLM tests
        run: uv run pytest tests/llm/ -v --tb=short -x --timeout=120
        timeout-minutes: 15
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
