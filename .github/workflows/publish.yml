name: Publish to PyPI

# Triggered on a semver tag push (e.g. v0.3.0). The `ci` job calls
# Kestrel CI as a reusable workflow — lint, unit, integration, and llm
# tests must ALL pass on the tag's SHA before `build` and `publish` fire.
# Then `build` produces sdist + wheel, asserts tag version == pyproject
# version, and `publish` uploads to PyPI via OIDC trusted publishing.
# No API token used.
#
# Trusted publisher binding on PyPI:
#   project:     kestrel-sovereign
#   owner:       KestrelSovereignAI
#   repository:  kestrel-sovereign
#   workflow:    publish.yml
#   environment: pypi

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to publish (e.g. v0.3.0)'
        required: true

permissions:
  contents: read

jobs:
  # CI gate — must pass before anything builds/publishes.
  # Calls Kestrel CI (.github/workflows/ci.yml) as a reusable workflow
  # so lint + unit + integration + llm tests run on the tag's SHA.
  # If any of those fail, build + publish don't fire.
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build sdist + wheel
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build
        run: uv build

      - name: Verify the version metadata matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(uv run --no-project python -c "import tomllib; print(tomllib.loads(open('pyproject.toml').read())['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches pyproject.toml version $PKG_VERSION"

      - name: Show artifacts
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish via OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
