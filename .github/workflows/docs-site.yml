name: Publish docs site

# Projects the OKF docs corpus (docs/**) into a Starlight static site and
# deploys it to GitHub Pages. The site is a pure projection — docs/ stays the
# source of truth; nothing here is hand-edited.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build_docs_site.py"
      - "scripts/docs_okf.py"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress run mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Project OKF corpus -> Starlight site
        run: uv run python scripts/build_docs_site.py build

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static site
        working-directory: site
        run: |
          npm install --no-audit --no-fund
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
