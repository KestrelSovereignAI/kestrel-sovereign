name: Publish docs site

# Projects the OKF docs corpus and released package Constitution into a
# Starlight static site and deploys it to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "kestrel_sovereign/data/constitutions/v2/**"
      - "scripts/build_docs_site.py"
      - "scripts/docs_okf.py"
      - "tests/docs_site/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress run mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Project OKF corpus -> Starlight site
        run: uv run python scripts/build_docs_site.py build

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static site
        working-directory: site
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify generated Constitution reader paths and source custody
        env:
          DOCS_SITE_NODE_MODULES: ${{ github.workspace }}/site/node_modules
        run: uv run pytest tests/docs_site/test_constitution_handbook.py -q

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
