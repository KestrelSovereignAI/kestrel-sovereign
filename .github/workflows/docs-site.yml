name: Publish docs site

# Projects the OKF docs corpus and released package Constitution into a
# Starlight static site and deploys it to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "doctrine/constitutions/v1/KESTREL_CONSTITUTION.md"
      - "kestrel_sovereign/data/constitutions/v2/**"
      - "scripts/build_docs_site.py"
      - "scripts/docs_okf.py"
      - "scripts/docs_verify.py"
      - "tests/docs_site/**"
      - "tests/unit/test_build_docs_site.py"
      - "tests/unit/test_docs_site_workflow.py"
      - ".github/workflows/docs-site.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "doctrine/constitutions/v1/KESTREL_CONSTITUTION.md"
      - "kestrel_sovereign/data/constitutions/v2/**"
      - "scripts/build_docs_site.py"
      - "scripts/docs_okf.py"
      - "scripts/docs_verify.py"
      - "tests/docs_site/**"
      - "tests/unit/test_build_docs_site.py"
      - "tests/unit/test_docs_site_workflow.py"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

# Hold the publication lock from build through deployment so older builds
# cannot publish after newer ones. PR checks use independent event/ref groups.
concurrency:
  group: >-
    ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    && 'pages' || format('docs-checks-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Project OKF corpus -> Starlight site
        run: uv run python scripts/build_docs_site.py build

      - name: Verify corpus selection and PR publication boundary
        run: uv run pytest tests/unit/test_build_docs_site.py tests/unit/test_docs_site_workflow.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static site
        working-directory: site
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify generated Constitution reader paths and source custody
        env:
          DOCS_SITE_NODE_MODULES: ${{ github.workspace }}/site/node_modules
        run: uv run pytest tests/docs_site/test_constitution_handbook.py -q

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
