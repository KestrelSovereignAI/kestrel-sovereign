name: Deploy to Cloud Run

# Triggered after Publish to PyPI completes successfully on a tag
# push. publish.yml is the canonical CI gate for the release; this
# workflow trusts that result and does not re-run pytest. Before
# the workflow_run rewire, three workflows (publish, deploy, this)
# each re-ran CI on the exact same SHA — burning minutes and
# adding independent flake-rolls; see commit 448801f6 (v0.10.0)
# where Release sign hit a flaky state-leak (responded_count=3 vs
# 1 in test_fs_write_requires_real_approval) on its tag-time
# re-run while the same code was already on PyPI.
#
# Build/deploy steps invoke ``uv run kestrel deploy {build,<profile>}``
# (epic #1050 sub-PR 1.4 — bash-to-Python port). All flags, secrets,
# and env vars live in deploy_config.toml; the workflow only carries
# what GitHub itself owns: GCP credentials, the resolved tag, and the
# KESTREL_ALLOWED_EMAILS secret consumed via ``${KESTREL_ALLOWED_EMAILS}``
# expansion in the TOML.

on:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      ref:
        description: 'Tag or branch to deploy (workflow_dispatch only)'
        required: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-central1
  PYTHON_VERSION: "3.13"

jobs:
  build:
    runs-on: ubuntu-latest
    # Only fire when the upstream Publish to PyPI succeeded (or on
    # workflow_dispatch). On workflow_run, github.event.workflow_run
    # is the upstream run; head_branch is the tag that triggered it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    permissions:
      contents: read
      id-token: write
    # Output the resolved ref so deploy-dev / deploy-prod check out the
    # SAME revision that was built. Codex review on PR #1064 caught
    # that without this, manual deploys with inputs.ref (and tag-push
    # deploys when main has moved) would deploy the just-built image
    # using deploy_config.toml + CLI from main, not the requested ref.
    outputs:
      resolved_ref: ${{ steps.resolved_ref.outputs.ref }}
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      # On workflow_run, github.ref points at main (the workflow file's
      # ref), not at the upstream tag. Resolve the tag from the
      # upstream run and check out THAT.
      - name: Resolve target ref
        id: resolved_ref
        env:
          DISPATCH_REF: ${{ inputs.ref }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$DISPATCH_REF" ]; then
            echo "ref=$DISPATCH_REF" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=$UPSTREAM_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.resolved_ref.outputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra cloud

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ``setup-gcloud`` is still needed because ``kestrel deploy build``
      # shells out to ``docker buildx``, and docker needs ``gcloud auth
      # configure-docker`` to push to gcr.io. The ``auth`` action above
      # writes credentials_json to a temp file and points
      # GOOGLE_APPLICATION_CREDENTIALS at it; gcloud picks that up here.
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Determine tag
        id: tag
        env:
          RESOLVED_REF: ${{ steps.resolved_ref.outputs.ref }}
        run: |
          if [[ "$RESOLVED_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag=$RESOLVED_REF" >> $GITHUB_OUTPUT
          else
            echo "tag=dev-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      # Single source of truth for image build: ``kestrel deploy build``
      # walks DEFAULT_TARGETS (kestrel + kestrel-multi_agent), runs
      # ``docker buildx build --push`` for each with the same multi-arch
      # platform list the bash script used, and tags both ``:<tag>`` and
      # ``:latest``. GITHUB_TOKEN is consumed via BuildKit secrets so
      # Dockerfiles installing private deps work.
      - name: Build and push Cloud Run images
        env:
          GCP_PROJECT_ID: ${{ env.PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: uv run kestrel deploy build --tag ${{ steps.tag.outputs.tag }}

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      # Check out the same ref that was built (see ``build.outputs``).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.resolved_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra cloud

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      # ``kestrel deploy dev`` reads deploy_config.toml's [profiles.dev]
      # for the full secret list / env vars / scaling — anything the
      # legacy ``deploy_dev.sh`` set is encoded there. KESTREL_ALLOWED_EMAILS
      # is interpolated via the ``${KESTREL_ALLOWED_EMAILS}`` placeholder
      # in the TOML, expanded by DeployManagerCore._expand_env_vars from
      # this step's environment.
      - name: Deploy to Cloud Run (dev)
        env:
          GCP_PROJECT_ID: ${{ env.PROJECT_ID }}
          KESTREL_ALLOWED_EMAILS: ${{ secrets.KESTREL_ALLOWED_EMAILS }}
        run: uv run kestrel deploy dev

      - name: Show dev URL
        run: |
          echo "Dev deployment complete! Sign in with authorized Google account."
          URL=$(gcloud run services describe kestrel-dev --region=${{ env.REGION }} --format='value(status.url)')
          echo "Service URL: $URL"

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build
    # Only deploy to prod on version tags (via workflow_run from
    # Publish to PyPI) or manual prod dispatch.
    if: >-
      (github.event_name == 'workflow_run' &&
       startsWith(github.event.workflow_run.head_branch, 'v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    permissions:
      contents: read
      id-token: write
    environment: production

    steps:
      # Check out the same ref that was built (see ``build.outputs``).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.resolved_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra cloud

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Deploy to Cloud Run (prod)
        env:
          GCP_PROJECT_ID: ${{ env.PROJECT_ID }}
          KESTREL_ALLOWED_EMAILS: ${{ secrets.KESTREL_ALLOWED_EMAILS }}
        run: uv run kestrel deploy prod

      - name: Show prod URL
        run: |
          echo "Prod deployment complete! Sign in with authorized Google account."
          URL=$(gcloud run services describe kestrel-prod --region=${{ env.REGION }} --format='value(status.url)')
          echo "Service URL: $URL"
