name: Deploy to Cloud Run

# Triggered after Publish to PyPI completes successfully on a tag
# push. publish.yml is the canonical CI gate for the release; this
# workflow trusts that result and does not re-run pytest. Before
# the workflow_run rewire, three workflows (publish, deploy, this)
# each re-ran CI on the exact same SHA — burning minutes and
# adding independent flake-rolls; see commit 448801f6 (v0.10.0)
# where Release sign hit a flaky state-leak (responded_count=3 vs
# 1 in test_fs_write_requires_real_approval) on its tag-time
# re-run while the same code was already on PyPI.

on:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      ref:
        description: 'Tag or branch to deploy (workflow_dispatch only)'
        required: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-central1
  IMAGE_NAME: kestrel

jobs:
  build:
    runs-on: ubuntu-latest
    # Only fire when the upstream Publish to PyPI succeeded (or on
    # workflow_dispatch). On workflow_run, github.event.workflow_run
    # is the upstream run; head_branch is the tag that triggered it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    permissions:
      contents: read
      id-token: write

    steps:
      # On workflow_run, github.ref points at main (the workflow file's
      # ref), not at the upstream tag. Resolve the tag from the
      # upstream run and check out THAT.
      - name: Resolve target ref
        id: resolved_ref
        env:
          DISPATCH_REF: ${{ inputs.ref }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$DISPATCH_REF" ]; then
            echo "ref=$DISPATCH_REF" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=$UPSTREAM_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.resolved_ref.outputs.ref }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Determine tag
        id: tag
        env:
          RESOLVED_REF: ${{ steps.resolved_ref.outputs.ref }}
        run: |
          if [[ "$RESOLVED_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag=$RESOLVED_REF" >> $GITHUB_OUTPUT
          else
            echo "tag=dev-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Build and push single-agent image
        run: |
          docker build \
            -f docker/Dockerfile.cloudrun \
            -t gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            -t gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest

      - name: Build and push multi_agent (multi-agent) image
        run: |
          docker build \
            -f docker/Dockerfile.multi_agent \
            --secret id=github_token,env=GITHUB_TOKEN \
            -t gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}-multi_agent:${{ steps.tag.outputs.tag }} \
            -t gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}-multi_agent:latest \
            .
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}-multi_agent:${{ steps.tag.outputs.tag }}
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}-multi_agent:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run (dev)
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2.7.6
        with:
          service: kestrel-dev
          image: gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}-multi_agent:latest
          region: ${{ env.REGION }}
          flags: >-
            --memory=2Gi
            --cpu=2
            --port=8080
            --min-instances=0
            --max-instances=10
            --timeout=300
            --concurrency=80
            --allow-unauthenticated
          secrets: |
            OPENAI_API_KEY=kestrel-openai-key:latest
            ANTHROPIC_API_KEY=kestrel-anthropic-key:latest
            KESTREL_API_KEY=kestrel-api-key:latest
            KESTREL_DATA_KEY=kestrel-data-key:latest
            GOOGLE_CLIENT_ID=kestrel-google-client-id:latest
            GOOGLE_CLIENT_SECRET=kestrel-google-client-secret:latest
            KESTREL_SESSION_SECRET=kestrel-session-secret:latest
            GITHUB_TOKEN=github-read-kestrel:latest
          env_vars: |
            KESTREL_ENV=development
            KESTREL_DB_BACKEND=sqlite
            KESTREL_DB_PATH=/app/agent_data
            KESTREL_AGENTS=Kestrel,kestrel-demo
            KESTREL_REQUIRE_OAUTH=true
            KESTREL_ALLOWED_EMAILS=${{ secrets.KESTREL_ALLOWED_EMAILS }}

      - name: Show dev URL
        run: |
          echo "Dev deployment complete! Sign in with authorized Google account."
          URL=$(gcloud run services describe kestrel-dev --region=${{ env.REGION }} --format='value(status.url)')
          echo "Service URL: $URL"

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build
    # Only deploy to prod on version tags (via workflow_run from
    # Publish to PyPI) or manual prod dispatch.
    if: >-
      (github.event_name == 'workflow_run' &&
       startsWith(github.event.workflow_run.head_branch, 'v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    permissions:
      contents: read
      id-token: write
    environment: production

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run (prod)
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2.7.6
        with:
          service: kestrel-prod
          image: gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest
          region: ${{ env.REGION }}
          flags: >-
            --memory=2Gi
            --cpu=2
            --port=8080
            --min-instances=1
            --max-instances=100
            --timeout=300
            --concurrency=80
            --allow-unauthenticated
          secrets: |
            OPENAI_API_KEY=kestrel-openai-key:latest
            KESTREL_API_KEY=kestrel-api-key:latest
            KESTREL_DATA_KEY=kestrel-data-key:latest
            GOOGLE_CLIENT_ID=kestrel-google-client-id:latest
            GOOGLE_CLIENT_SECRET=kestrel-google-client-secret:latest
            KESTREL_SESSION_SECRET=kestrel-session-secret:latest
          env_vars: |
            KESTREL_ENV=production
            KESTREL_DB_BACKEND=sqlite
            KESTREL_DB_PATH=/app/agent_data
            KESTREL_ALLOWED_EMAILS=${{ secrets.KESTREL_ALLOWED_EMAILS }}

      - name: Show prod URL
        run: |
          echo "Prod deployment complete! Sign in with authorized Google account."
          URL=$(gcloud run services describe kestrel-prod --region=${{ env.REGION }} --format='value(status.url)')
          echo "Service URL: $URL"
