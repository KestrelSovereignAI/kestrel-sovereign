name: Release sign

# Auto-sign release artifacts with SLH-DSA-SHA2-128s when a v* tag is
# pushed. Wave 5 sub-PR 3 of Quantum Hardening (#921, #920).
#
# Required GitHub Actions secrets:
#   KESTREL_RELEASE_SECRET_B64 — base64-url-encoded raw SLH-DSA-128s secret (64 bytes)
#   KESTREL_RELEASE_PUBLIC_B64 — base64-url-encoded raw SLH-DSA-128s public (32 bytes)
#   KESTREL_DATA_KEY — encryption key for the SecureKeyStorage bundles at rest

on:
  push:
    # GH Actions tag filters use glob, not regex — ``+`` is literal.
    # Codex P1 round 1: the previous ``v[0-9]+.[0-9]+.[0-9]+`` would
    # never match a real semver tag like ``v1.2.3``.
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to sign (e.g. v1.2.3)'
        required: true

permissions:
  contents: write    # Needed to attach signed manifest to the GitHub Release

env:
  PYTHON_VERSION: "3.13"

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Build wheel and sdist
        run: |
          uv build --wheel --sdist --out-dir dist/
          ls -la dist/

      - name: Load signing key into SecureKeyStorage
        env:
          KESTREL_DATA_KEY: ${{ secrets.KESTREL_DATA_KEY }}
          KESTREL_RELEASE_SECRET_B64: ${{ secrets.KESTREL_RELEASE_SECRET_B64 }}
          KESTREL_RELEASE_PUBLIC_B64: ${{ secrets.KESTREL_RELEASE_PUBLIC_B64 }}
        run: |
          uv run python scripts/release/load_signing_key_from_env.py \
            --storage-dir ./release-keys \
            --key-id release-key

      - name: Determine release tag
        id: release_tag
        # Codex P2: ${GITHUB_REF##*/} resolves to the workflow's run
        # ref. For workflow_dispatch that's the *branch* the operator
        # picked from the GitHub UI, not their typed-in inputs.ref.
        # Use the explicit input for dispatch; fall back to GITHUB_REF
        # for tag pushes.
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            TAG="${{ github.event.inputs.ref }}"
          else
            TAG="${GITHUB_REF##*/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Sign release manifest
        env:
          KESTREL_DATA_KEY: ${{ secrets.KESTREL_DATA_KEY }}
        # Codex P1 round 1: the trusted-signer stderr capture cannot
        # land inside ``./dist`` — the shell creates the file at
        # redirect time, the CLI walks dist and hashes the (then-empty)
        # capture file into the manifest, then the CLI writes stderr
        # to it AFTER hashing. Self-verify would then see different
        # bytes than the manifest claims.
        # Write the capture under workflow scratch dir; copy to dist
        # AFTER signing so it lives alongside the manifest.
        run: |
          mkdir -p ./signing-stderr
          uv run kestrel release sign \
            --artifacts-dir ./dist \
            --release-tag "${{ steps.release_tag.outputs.tag }}" \
            --key-id release-key \
            --signer-did "did:web:kestrelsovereignai.github.io" \
            --kid "release-key-1" \
            --output ./dist/release-manifest.json \
            --storage-dir ./release-keys 2> ./signing-stderr/trusted-signer.txt
          grep "trusted_signer_multibase" ./signing-stderr/trusted-signer.txt || true

      - name: Self-verify the just-signed release
        env:
          KESTREL_DATA_KEY: ${{ secrets.KESTREL_DATA_KEY }}
          KESTREL_RELEASE_PUBLIC_B64: ${{ secrets.KESTREL_RELEASE_PUBLIC_B64 }}
        # Self-verify catches keypair-mismatch / corrupted-manifest
        # bugs BEFORE the artifacts get uploaded to the release. The
        # multibase pubkey we trust is computed from the public-side
        # env var, not parsed from sign's stderr (avoids a parsing
        # dependency on the human-readable output).
        run: |
          PUB_MB=$(uv run python -c "
          import base64, os
          from kestrel_sovereign.security.crypto_suite import SLHDSASHA2128sSuite
          from kestrel_sovereign.security.multikey import public_key_to_multibase
          pub_b64 = os.environ['KESTREL_RELEASE_PUBLIC_B64']
          pad = '=' * ((4 - len(pub_b64) % 4) % 4)
          pub = base64.urlsafe_b64decode(pub_b64 + pad)
          print(public_key_to_multibase(SLHDSASHA2128sSuite(), pub))
          ")
          uv run kestrel release verify \
            --manifest ./dist/release-manifest.json \
            --artifacts-dir ./dist \
            --trusted-signer-multibase "$PUB_MB"

      - name: Upload signed manifest as workflow artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-manifest
          path: |
            dist/release-manifest.json
            signing-stderr/trusted-signer.txt
          retention-days: 90

      - name: Attach signed manifest to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.4
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/release-manifest.json
            signing-stderr/trusted-signer.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
