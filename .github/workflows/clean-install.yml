name: Clean Install Validation

# Validates that QUICKSTART.md works on a fresh machine.
# Covers: git clone → uv sync → kestrel setup --quickstart → kestrel doctor
#         → kestrel start → 3 pillars verified → DID persists across restart.
#
# The verification logic lives in scripts/ci/clean_install_verify.py — pure
# Python with no shell idioms — so this workflow runs identically on
# Ubuntu, macOS, and Windows runners (where steps would otherwise default
# to PowerShell).
#
# See: https://github.com/KestrelSovereignAI/kestrel-sovereign/issues/184

on:
  push:
    branches: [main, vision-refinement-v2]
  pull_request:
    branches: [main, vision-refinement-v2]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  KESTREL_AUDIT_MODE: "skip"
  # Force the wizard's non-TTY branch so it never blocks on a prompt.
  # With this set, build_context() returns NonInteractivePrompter which
  # accepts defaults silently — exactly what --quickstart needs in CI.
  KESTREL_NONINTERACTIVE: "1"

# The wizard creates an agent named "Kestrel" by default in quickstart
# mode (kestrel_sovereign/setup/steps/agent.py::_prompt_name). Centralise
# the name so future renames stay in lockstep with the wizard.
jobs:
  clean-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AGENT_NAME: "Kestrel"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # QUICKSTART Step 2: install dependencies
      - name: Install dependencies (uv sync)
        run: uv sync

      # QUICKSTART Step 4: run the setup wizard.
      # --quickstart accepts Ollama as the LLM (no API key needed in CI),
      # generates KESTREL_DATA_KEY + KESTREL_API_KEY, writes [llm] into
      # kestrel.toml, and runs inception for an agent named "Kestrel".
      - name: Run setup wizard (kestrel setup --quickstart)
        run: uv run kestrel setup --quickstart

      # All assertions below delegate to scripts/ci/clean_install_verify.py.
      # That script is pure Python (stdlib only, no shell idioms), so each
      # `run:` is a single command line — identical on bash, PowerShell, cmd.
      - name: Verify wizard artifacts (.env, kestrel.toml, rookery.toml)
        run: uv run python scripts/ci/clean_install_verify.py wizard-artifacts

      - name: Run kestrel doctor (readiness gate)
        run: uv run kestrel doctor

      - name: Verify Identity Pillar
        run: uv run python scripts/ci/clean_install_verify.py identity --agent-name "${{ env.AGENT_NAME }}"

      - name: Verify Constitution Pillar
        run: uv run python scripts/ci/clean_install_verify.py constitution --agent-name "${{ env.AGENT_NAME }}"

      - name: Verify Memory Pillar
        run: uv run python scripts/ci/clean_install_verify.py memory --agent-name "${{ env.AGENT_NAME }}"

      - name: Start agent and verify health endpoint
        run: uv run python scripts/ci/clean_install_verify.py start-and-health --agent-name "${{ env.AGENT_NAME }}"

      - name: Verify DID persists across restart
        run: uv run python scripts/ci/clean_install_verify.py did-persists --agent-name "${{ env.AGENT_NAME }}"

      - name: Summary
        if: always()
        run: |
          echo "Clean Install Validation matrix: ${{ matrix.os }}"
          echo "Python: ${{ env.PYTHON_VERSION }}"
          echo "Agent: ${{ env.AGENT_NAME }}"
