name: Clean Install Validation

# Validates that QUICKSTART.md works on a fresh machine — across two
# install methods so packaging regressions are caught before they hit
# PyPI users:
#
#   sync   git clone → uv sync                      (the source-clone path)
#   wheel  git clone → uv build --wheel → pip       (what `pip install
#                                                    kestrel-sovereign`
#                                                    exercises end-to-end)
#
# Both paths run the same readiness assertions: kestrel setup → doctor →
# 3 pillars → start → /health → top-level /v1/chat/completions returns 503
# → DID persists across restart → agent is tagged is_test_instance.
#
# The verification logic lives in scripts/ci/clean_install_verify.py —
# pure Python with no shell idioms — so each step runs identically on
# Ubuntu, macOS, and Windows runners (where steps would otherwise default
# to PowerShell).
#
# See: https://github.com/KestrelSovereignAI/kestrel-sovereign/issues/184

# Cost shape (kestrel-sovereign is a public repo):
#   Linux minutes bill $0 — so the Linux sync+wheel axis runs on every PR
#   for fast feedback. macOS and Windows minutes ARE billed even on a public
#   repo (~10x Linux for macOS 3-core), so the cross-platform axis is NOT run
#   per-merge. It runs only where a packaging regression actually matters:
#     - as a HARD GATE before the PyPI publish (workflow_call from publish.yml,
#       on the tag's SHA — a broken fresh install blocks the upload), and
#     - a weekly safety-net sweep so a platform-only regression can't lurk for
#       a whole release cycle undiscovered.
#   Run the macOS axis locally pre-tag too: scripts/ci/clean_install_verify.py
#   is pure Python and OS-agnostic, so it reproduces on a dev Mac for free.
on:
  pull_request:
    branches: [main, vision-refinement-v2, 'epic/**']
  schedule:
    # Weekly cross-platform clean-install safety net (Mondays, off-hours UTC).
    - cron: "23 8 * * 1"
  # Invoked as a pre-publish gate by publish.yml on a release tag. The caller
  # passes secrets via `secrets: inherit`; the tag's original push event makes
  # select-matrix resolve to the full macOS+Windows+Linux matrix below.
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref/SHA to validate. publish.yml passes the release ref so this
          gate runs against the EXACT SHA being published. Empty for every
          other trigger, where checkout falls back to its default event ref.
        required: false
        type: string
  workflow_dispatch:

# During churn, supersede an in-flight PR run when a new commit is pushed to
# the same ref. Never cancels main/tag/scheduled runs — only PR events — so a
# release-gate or nightly run always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  KESTREL_AUDIT_MODE: "skip"
  KESTREL_SKIP_REACHABILITY_PROBE: "1"
  # Force the wizard's non-TTY branch so it never blocks on a prompt.
  # With this set, build_context() returns NonInteractivePrompter which
  # accepts defaults silently — exactly what --quickstart needs in CI.
  KESTREL_NONINTERACTIVE: "1"
  # Mark every agent the wizard incepts in CI as a test instance. The
  # CLI honours this env var in cmd_setup; the inception_service writes
  # is_test_instance=True + a generated test_cycle_id onto the agent's
  # properties node. Catches the next bystander who reads from a CI
  # database thinking they have a real agent.
  KESTREL_TEST_INSTANCE: "1"
  # Per-job dynamic value, set by the "Resolve uv run flag" step below.
  # Pre-declared here so the linter recognises ``${{ env.UVRUN }}`` in
  # subsequent steps; the actual value is written at runtime via
  # ``echo UVRUN=... >> "$GITHUB_ENV"``.
  UVRUN: ""
  # Python 3.11+ flag that blocks Python from prepending the cwd / script
  # dir to ``sys.path``. Without this, ``python -m kestrel_sovereign.cli``
  # run from the checkout root would resolve ``kestrel_sovereign`` against
  # the source tree even on the wheel matrix — so a packaging regression
  # in the wheel could silently slip through. Editable installs (used by
  # the sync matrix) still resolve via ``site-packages`` ``.pth`` entries,
  # which are unaffected by this flag — both paths keep working.
  PYTHONSAFEPATH: "1"

# The wizard creates an agent named "Kestrel" by default in quickstart
# mode (kestrel_sovereign/setup/steps/agent.py::_prompt_name). Centralise
# the name so future renames stay in lockstep with the wizard.
jobs:
  select-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      full_matrix: ${{ steps.matrix.outputs.full_matrix }}
    steps:
      # Pull requests run the free Linux-only axis for fast feedback. Every
      # other trigger — the weekly sweep, a workflow_dispatch, and the
      # pre-publish gate invoked via workflow_call on a tag (which surfaces
      # here as a non-pull_request event) — runs the full cross-platform
      # matrix. No checkout/diff needed: the decision is purely event-based.
      - name: Select clean-install matrix
        id: matrix
        shell: bash
        run: |
          full=false

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            full=true
          fi

          if [ "$full" = true ]; then
            matrix='{"include":[{"os":"ubuntu-latest","install_method":"sync"},{"os":"ubuntu-latest","install_method":"wheel"},{"os":"macos-latest","install_method":"sync"},{"os":"macos-latest","install_method":"wheel"},{"os":"windows-latest","install_method":"sync"},{"os":"windows-latest","install_method":"wheel"}]}'
          else
            matrix='{"include":[{"os":"ubuntu-latest","install_method":"sync"},{"os":"ubuntu-latest","install_method":"wheel"}]}'
          fi

          echo "full_matrix=$full" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  clean-install:
    needs: select-matrix
    strategy:
      fail-fast: false
      # Pull requests always run Ubuntu sync + wheel. The macOS/Windows
      # axis is reserved for scheduled/manual/main runs and PRs that touch
      # packaging, setup, install, or CI-sensitive surfaces.
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AGENT_NAME: "Kestrel"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}  # release SHA when called from publish.yml; default ref otherwise

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # QUICKSTART Step 2 (sync): install dependencies straight from the
      # source tree via uv. Subsequent ``uv run`` invocations re-sync
      # against pyproject.toml + uv.lock, so we don't pass --no-sync.
      - name: Install dependencies (uv sync)
        if: matrix.install_method == 'sync'
        run: uv sync

      # QUICKSTART Step 2 (wheel): build a wheel from this checkout and
      # install it into a clean .venv. Mirrors what a downstream user
      # gets from ``pip install kestrel-sovereign``. We stop ``uv run``
      # from re-syncing (which would clobber the wheel install with the
      # source tree) by setting UVRUN=uv run --no-sync below.
      - name: Build wheel + install into clean venv
        if: matrix.install_method == 'wheel'
        shell: bash
        run: |
          uv build --wheel
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install dist/*.whl

      # Each run line uses ``${{ env.UVRUN }}`` so we don't need an
      # ``if:`` per step. ``--no-sync`` is mandatory on the wheel path
      # (otherwise uv re-syncs from pyproject.toml on the first run and
      # silently overwrites the wheel install with the source tree).
      - name: Resolve uv run flag for matrix install_method
        shell: bash
        run: |
          if [ "${{ matrix.install_method }}" = "wheel" ]; then
            echo "UVRUN=uv run --no-sync" >> "$GITHUB_ENV"
          else
            echo "UVRUN=uv run" >> "$GITHUB_ENV"
          fi

      # QUICKSTART Step 4: run the setup wizard.
      # --quickstart accepts Ollama as the LLM (no API key needed in CI),
      # generates KESTREL_DATA_KEY + KESTREL_API_KEY, writes [llm] into
      # kestrel.toml, and runs inception for an agent named "Kestrel".
      # KESTREL_TEST_INSTANCE=1 (workflow env) flips inception's
      # is_test_instance flag so the agent is identifiable as a CI agent.
      - name: Run setup wizard (kestrel setup --quickstart)
        run: ${{ env.UVRUN }} kestrel setup --quickstart

      # All assertions below delegate to scripts/ci/clean_install_verify.py.
      # That script is pure Python (stdlib only, no shell idioms), so each
      # `run:` is a single command line — identical on bash, PowerShell, cmd.
      - name: Verify wizard artifacts (.env, kestrel.toml, multi_agent.toml)
        run: ${{ env.UVRUN }} python scripts/ci/clean_install_verify.py wizard-artifacts

      - name: Run kestrel doctor (readiness gate)
        run: ${{ env.UVRUN }} kestrel doctor

      - name: Verify Identity Pillar
        run: ${{ env.UVRUN }} python scripts/ci/clean_install_verify.py identity --agent-name "${{ env.AGENT_NAME }}"

      - name: Verify Constitution Pillar
        run: ${{ env.UVRUN }} python scripts/ci/clean_install_verify.py constitution --agent-name "${{ env.AGENT_NAME }}"

      - name: Verify Memory Pillar
        run: ${{ env.UVRUN }} python scripts/ci/clean_install_verify.py memory --agent-name "${{ env.AGENT_NAME }}"

      - name: Verify agent is tagged as a test instance
        run: ${{ env.UVRUN }} python scripts/ci/clean_install_verify.py test-instance --agent-name "${{ env.AGENT_NAME }}"

      - name: Start agent and verify health endpoint
        run: ${{ env.UVRUN }} python scripts/ci/clean_install_verify.py start-and-health --agent-name "${{ env.AGENT_NAME }}"

      # No-LLM contract probe: in multi-agent host mode, /v1/chat/completions
      # must 503 (routing) rather than 500 (server error). Locks in #1110.
      - name: Verify host top-level /v1/chat/completions → 503
        run: ${{ env.UVRUN }} python scripts/ci/clean_install_verify.py host-and-chat-503

      - name: Verify DID persists across restart
        run: ${{ env.UVRUN }} python scripts/ci/clean_install_verify.py did-persists --agent-name "${{ env.AGENT_NAME }}"

      - name: Summary
        if: always()
        run: |
          echo "Clean Install Validation matrix: ${{ matrix.os }} / ${{ matrix.install_method }}"
          echo "Python: ${{ env.PYTHON_VERSION }}"
          echo "Agent: ${{ env.AGENT_NAME }}"
