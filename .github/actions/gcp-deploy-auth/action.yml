name: Google Cloud deployment identity
description: Authenticate the deployment workflow with repository-scoped federation.
inputs:
  workload_identity_provider:
    description: Full Google Cloud workload identity provider resource name.
    required: true
  service_account:
    description: Deployment service account to impersonate.
    required: true
  project_id:
    description: Target Google Cloud project ID.
    required: true
runs:
  using: composite
  steps:
    - name: Require deployment federation configuration
      shell: bash
      env:
        GCP_WIF_PROVIDER: ${{ inputs.workload_identity_provider }}
        GCP_DEPLOY_SERVICE_ACCOUNT: ${{ inputs.service_account }}
        GCP_DEPLOY_PROJECT_ID: ${{ inputs.project_id }}
      run: |
        : "${GCP_WIF_PROVIDER:?Set the GCP_WIF_PROVIDER repository variable}"
        : "${GCP_DEPLOY_SERVICE_ACCOUNT:?Set the GCP_DEPLOY_SERVICE_ACCOUNT repository variable}"
        : "${GCP_DEPLOY_PROJECT_ID:?A deployment project ID is required}"
    - name: Authenticate with GitHub OIDC
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        project_id: ${{ inputs.project_id }}
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
