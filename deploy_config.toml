# Deploy Configuration for Kestrel Self-Deployment
#
# This file configures deployment profiles for agents to deploy themselves
# to cloud platforms like Cloud Run, Azure Container Apps, etc.
#
# Source of truth (epic #1050 sub-PR 1.4): the legacy bash scripts under
# ``scripts/cloudrun/*.sh`` were retired and the equivalent flags are
# encoded here. ``kestrel deploy <profile>`` is byte-equivalent to what
# ``bash scripts/cloudrun/deploy_*.sh`` did on Linux/macOS.

[manager]
default_provider = "cloudrun"
gcp_project_id = "your-gcp-project-id"
image_name = "kestrel"
build_strategy = "prebuilt"      # prebuilt | local | cloudbuild
health_check_timeout_seconds = 120
health_check_path = "/health"

# =============================================================================
# Cloud Run profiles (live)
# =============================================================================

# Development Profile - Cloud Run (multi-agent host, always warm)
#
# Mirrors legacy scripts/cloudrun/deploy_dev.sh. The dev profile runs the
# multi-agent host (``Kestrel,kestrel-demo``) and so deploys the
# ``kestrel-multi_agent`` image — DeployManagerCore.build_image_reference
# derives that suffix from ``deployment_mode = "multi_agent"``. The legacy
# bash deploy_dev.sh referenced ``kestrel-multi-agent`` (hyphen) which no
# build path produced; sub-PR 1.4 reconciles on the underscore form that
# ``scripts/cloudrun/build.sh`` and .github/workflows/deploy.yml both use.
[profiles.dev]
name = "Cloud Run Development"
provider = "cloudrun"
service_name = "kestrel-dev"
region = "us-central1"
deployment_mode = "multi_agent"
persistence_mode = "ephemeral_demo"
min_instances = 1
max_instances = 1
memory = "2Gi"
cpu = 2
port = 8080
timeout = 300
concurrency = 80

[profiles.dev.env_vars]
KESTREL_DID_WEB_DOMAIN = "agents.kestrelsovereign.com"
KESTREL_ENV = "development"
KESTREL_DB_BACKEND = "sqlite"
KESTREL_DB_PATH = "/app/agent_data"
KESTREL_DEPLOYMENT_PERSISTENCE = "ephemeral_demo"
KESTREL_AGENTS = "Kestrel,kestrel-demo"
KESTREL_REQUIRE_OAUTH = "true"
# ``${KESTREL_ALLOWED_EMAILS}`` is expanded by DeployManagerCore._expand_env_vars
# at deploy time. The legacy bash used ``${KESTREL_ALLOWED_EMAILS:?...}`` to
# fail loudly when unset; here, an unset var simply yields the literal
# placeholder which Cloud Run will reject — same outcome, different shape.
KESTREL_ALLOWED_EMAILS = "${KESTREL_ALLOWED_EMAILS}"

[profiles.dev.secrets]
# Secrets are mounted from GCP Secret Manager
# Format: secret-name:version
OPENAI_API_KEY = "kestrel-openai-key:latest"
ANTHROPIC_API_KEY = "kestrel-anthropic-key:latest"
KESTREL_API_KEY = "kestrel-api-key:latest"
KESTREL_DATA_KEY = "kestrel-data-key:latest"
LIGHTHOUSE_API_KEY = "kestrel-lighthouse-key:latest"
GOOGLE_CLIENT_ID = "kestrel-google-client-id:latest"
GOOGLE_CLIENT_SECRET = "kestrel-google-client-secret:latest"
KESTREL_SESSION_SECRET = "kestrel-session-secret:latest"
GITHUB_TOKEN = "github-read-kestrel:latest"
GITHUB_APP_ID = "github-app-id:latest"
GITHUB_APP_PRIVATE_KEY = "github-app-private-key:latest"
GITHUB_APP_WEBHOOK_SECRET = "github-app-webhook-secret:latest"

# Production Profile - Cloud Run (durable single-agent, always warm)
#
# The container filesystem is disposable. Production restores one encrypted,
# version-pinned identity bundle from Secret Manager and keeps coherent state
# in PostgreSQL. The profile stays single-agent until per-agent custody and
# database bindings exist for the multi-agent host.
#
# ``max_instances`` is capped at 1 to match the substrate that actually exists.
# Durable custody *permits* horizontal scale — every instance restores the same
# verified identity over the same transactional database — but permission is not
# capacity. Each instance opens up to 10 pooled plus 4 advisory PostgreSQL
# connections (storage/db/postgres.py), and the provisioned Cloud SQL instance is
# a ``db-f1-micro`` whose connection ceiling is ~25: a second instance exhausts
# it. The previous value of 100 declared headroom nothing had been provisioned to
# serve, which is the same shape of defect as a durable record claiming an
# unobserved event.
#
# Raising this is therefore a paired change: raise the Cloud SQL tier (or add a
# connection pooler) in the same pass, or the cap is the only thing standing
# between a scale-up and connection exhaustion.
[profiles.prod]
name = "Cloud Run Production"
provider = "cloudrun"
service_name = "kestrel-prod"
region = "us-central1"
persistence_mode = "durable_sovereign"
min_instances = 1
max_instances = 1
memory = "2Gi"
cpu = 2
port = 8080
timeout = 300
concurrency = 80

[profiles.prod.env_vars]
KESTREL_DID_WEB_DOMAIN = "agents.kestrelsovereign.com"
KESTREL_ENV = "production"
KESTREL_DB_BACKEND = "postgres"
KESTREL_DB_PATH = "/app/agent_data"
KESTREL_DEPLOYMENT_PERSISTENCE = "durable_sovereign"
KESTREL_EXPECTED_DID = "${KESTREL_PROD_EXPECTED_DID}"
KESTREL_REQUIRE_OAUTH = "true"
KESTREL_ALLOWED_EMAILS = "${KESTREL_ALLOWED_EMAILS}"

[profiles.prod.secrets]
OPENAI_API_KEY = "kestrel-openai-key:latest"
KESTREL_API_KEY = "kestrel-api-key:latest"
KESTREL_DATABASE_URL = "kestrel-prod-database-url:1"
KESTREL_DATA_KEY = "kestrel-data-key:1"
KESTREL_IDENTITY_BUNDLE = "kestrel-prod-identity-bundle:1"
GOOGLE_CLIENT_ID = "kestrel-google-client-id:latest"
GOOGLE_CLIENT_SECRET = "kestrel-google-client-secret:latest"
KESTREL_SESSION_SECRET = "kestrel-session-secret:latest"

# =============================================================================
# MultiAgent Profiles (Multi-Agent Host)
# =============================================================================
# MultiAgent profiles deploy the host (host.py) + all agents in a single container.
# Uses docker/Dockerfile.multi_agent which runs the multi_agent host process manager.

# MultiAgent Development - Cloud Run (scales to zero)
#
# Mirrors legacy scripts/cloudrun/deploy_multi_agent_dev.sh. Uses the
# multi_agent image (``kestrel-multi_agent``), 4Gi/4CPU for host + agents.
[profiles.multi-agent-dev]
name = "MultiAgent Development (Multi-Agent)"
provider = "cloudrun"
service_name = "kestrel-multi-agent-dev"
region = "us-central1"
deployment_mode = "multi_agent"
persistence_mode = "ephemeral_demo"
min_instances = 0
max_instances = 1
memory = "4Gi"
cpu = 4
port = 8080
timeout = 300
concurrency = 80

[profiles.multi-agent-dev.env_vars]
KESTREL_DID_WEB_DOMAIN = "agents.kestrelsovereign.com"
KESTREL_ENV = "development"
KESTREL_DB_BACKEND = "sqlite"
KESTREL_DEPLOYMENT_PERSISTENCE = "ephemeral_demo"
KESTREL_HOST_AUTOSTART = "true"
KESTREL_ALLOWED_EMAILS = "${KESTREL_ALLOWED_EMAILS}"

[profiles.multi-agent-dev.secrets]
OPENAI_API_KEY = "kestrel-openai-key:latest"
KESTREL_API_KEY = "kestrel-api-key:latest"
KESTREL_DATA_KEY = "kestrel-data-key:latest"
LIGHTHOUSE_API_KEY = "kestrel-lighthouse-key:latest"
GOOGLE_CLIENT_ID = "kestrel-google-client-id:latest"
GOOGLE_CLIENT_SECRET = "kestrel-google-client-secret:latest"
KESTREL_SESSION_SECRET = "kestrel-session-secret:latest"

# MultiAgent Production - Cloud Run (always warm)
#
# No legacy bash script — this profile is Python-native and was added
# alongside the deploy CLI. Kept as-is by sub-PR 1.4.
[profiles.multi-agent-prod]
name = "MultiAgent Production (Multi-Agent)"
provider = "cloudrun"
service_name = "kestrel-multi-agent-prod"
region = "us-central1"
deployment_mode = "multi_agent"
persistence_mode = "durable_sovereign"
min_instances = 1
max_instances = 100
memory = "4Gi"
cpu = 4
port = 8080
timeout = 300
concurrency = 80

[profiles.multi-agent-prod.env_vars]
KESTREL_DID_WEB_DOMAIN = "agents.kestrelsovereign.com"
KESTREL_ENV = "production"
KESTREL_DB_BACKEND = "postgres"
KESTREL_DEPLOYMENT_PERSISTENCE = "durable_sovereign"
KESTREL_HOST_AUTOSTART = "true"

[profiles.multi-agent-prod.secrets]
OPENAI_API_KEY = "kestrel-openai-key:latest"
KESTREL_API_KEY = "kestrel-api-key:latest"
KESTREL_DATA_KEY = "kestrel-data-key:latest"
LIGHTHOUSE_API_KEY = "kestrel-lighthouse-key:latest"

