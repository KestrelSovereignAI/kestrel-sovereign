# Deploy Configuration for Kestrel Self-Deployment
#
# This file configures deployment profiles for agents to deploy themselves
# to cloud platforms like Cloud Run, Azure Container Apps, etc.
#
# Copy to deploy_config.toml and configure for your environment.

[manager]
default_provider = "cloudrun"
gcp_project_id = "your-gcp-project-id"
image_name = "kestrel"
build_strategy = "prebuilt"      # prebuilt | local | cloudbuild
health_check_timeout_seconds = 120
health_check_path = "/health"

# Development Profile - Cloud Run (scales to zero)
[profiles.dev]
name = "Cloud Run Development"
provider = "cloudrun"
service_name = "kestrel-dev"
region = "us-central1"
min_instances = 0
max_instances = 10
memory = "2Gi"
cpu = 2
port = 8080
timeout = 300
concurrency = 80

[profiles.dev.env_vars]
KESTREL_ENV = "development"
KESTREL_DB_BACKEND = "sqlite"
KESTREL_DB_PATH = "/app/agent_data"

[profiles.dev.secrets]
# Secrets are mounted from GCP Secret Manager
# Format: secret-name:version
OPENAI_API_KEY = "kestrel-openai-key:latest"
KESTREL_API_KEY = "kestrel-api-key:latest"
KESTREL_DATA_KEY = "kestrel-data-key:latest"
LIGHTHOUSE_API_KEY = "kestrel-lighthouse-key:latest"

# Production Profile - Cloud Run (always warm, auto-scales)
[profiles.prod]
name = "Cloud Run Production"
provider = "cloudrun"
service_name = "kestrel-prod"
region = "us-central1"
min_instances = 1
max_instances = 100
memory = "2Gi"
cpu = 2
port = 8080
timeout = 300
concurrency = 80

[profiles.prod.env_vars]
KESTREL_ENV = "production"
KESTREL_DB_BACKEND = "sqlite"
KESTREL_DB_PATH = "/app/agent_data"

[profiles.prod.secrets]
OPENAI_API_KEY = "kestrel-openai-key:latest"
KESTREL_API_KEY = "kestrel-api-key:latest"
KESTREL_DATA_KEY = "kestrel-data-key:latest"
LIGHTHOUSE_API_KEY = "kestrel-lighthouse-key:latest"

# =============================================================================
# Rookery Profiles (Multi-Agent Host)
# =============================================================================
# Rookery profiles deploy the host (host.py) + all agents in a single container.
# Uses docker/Dockerfile.rookery which runs the rookery host process manager.

# Rookery Development - Cloud Run (scales to zero)
[profiles.rookery-dev]
name = "Rookery Development (Multi-Agent)"
provider = "cloudrun"
service_name = "kestrel-rookery-dev"
region = "us-central1"
deployment_mode = "rookery"
min_instances = 0
max_instances = 10
memory = "4Gi"
cpu = 4
port = 8080
timeout = 300
concurrency = 80

[profiles.rookery-dev.env_vars]
KESTREL_ENV = "development"
KESTREL_DB_BACKEND = "sqlite"
KESTREL_HOST_AUTOSTART = "true"

[profiles.rookery-dev.secrets]
OPENAI_API_KEY = "kestrel-openai-key:latest"
KESTREL_API_KEY = "kestrel-api-key:latest"
KESTREL_DATA_KEY = "kestrel-data-key:latest"
LIGHTHOUSE_API_KEY = "kestrel-lighthouse-key:latest"

# Rookery Production - Cloud Run (always warm)
[profiles.rookery-prod]
name = "Rookery Production (Multi-Agent)"
provider = "cloudrun"
service_name = "kestrel-rookery-prod"
region = "us-central1"
deployment_mode = "rookery"
min_instances = 1
max_instances = 100
memory = "4Gi"
cpu = 4
port = 8080
timeout = 300
concurrency = 80

[profiles.rookery-prod.env_vars]
KESTREL_ENV = "production"
KESTREL_DB_BACKEND = "sqlite"
KESTREL_HOST_AUTOSTART = "true"

[profiles.rookery-prod.secrets]
OPENAI_API_KEY = "kestrel-openai-key:latest"
KESTREL_API_KEY = "kestrel-api-key:latest"
KESTREL_DATA_KEY = "kestrel-data-key:latest"
LIGHTHOUSE_API_KEY = "kestrel-lighthouse-key:latest"

# =============================================================================
# Azure Container Apps Profiles
# =============================================================================

# Azure Rookery Development (scales to zero)
[profiles.azure-rookery-dev]
name = "Azure Rookery Development (Multi-Agent)"
provider = "azure"
service_name = "kestrel-rookery-dev"
region = "eastus2"
deployment_mode = "rookery"
min_instances = 0
max_instances = 10
memory = "4Gi"
cpu = 4
port = 8080
timeout = 300
concurrency = 80

[profiles.azure-rookery-dev.env_vars]
KESTREL_ENV = "development"
KESTREL_DB_BACKEND = "sqlite"
KESTREL_HOST_AUTOSTART = "true"

[profiles.azure-rookery-dev.secrets]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
KESTREL_API_KEY = "${KESTREL_API_KEY}"
KESTREL_DATA_KEY = "${KESTREL_DATA_KEY}"
LIGHTHOUSE_API_KEY = "${LIGHTHOUSE_API_KEY}"

# Azure Single-Agent Development (scales to zero)
[profiles.azure-dev]
name = "Azure Container Apps Development"
provider = "azure"
service_name = "kestrel-dev"
region = "eastus2"
min_instances = 0
max_instances = 10
memory = "2Gi"
cpu = 2
port = 8080
timeout = 300
concurrency = 80

[profiles.azure-dev.env_vars]
KESTREL_ENV = "development"
KESTREL_DB_BACKEND = "sqlite"
KESTREL_DB_PATH = "/app/agent_data"

[profiles.azure-dev.secrets]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
KESTREL_API_KEY = "${KESTREL_API_KEY}"
KESTREL_DATA_KEY = "${KESTREL_DATA_KEY}"
