checks:
  - name: OKF metadata validation
    command: uv run python scripts/docs_okf.py validate --all docs

  - name: Generated feature docs dry run
    command: uv run python scripts/generate_feature_docs.py --all --dry-run

  - name: Generated feature docs metadata
    command: uv run python scripts/generate_feature_docs.py --check

  - name: Demo evidence index
    command: uv run python scripts/generate_demo_evidence_docs.py --check

  - name: OKF generated indexes
    command: uv run python scripts/docs_okf.py index --check

  - name: OKF generated logs
    command: uv run python scripts/docs_okf.py log --check

  - name: Documentation verification ledger
    command: uv run python scripts/docs_verify.py audit --check

  - name: Documentation render manifest
    command: uv run python scripts/docs_verify.py manifest --check

  - name: Relative documentation links
    command: uv run python scripts/check_docs_links.py

  - name: Relative link checker unit tests
    command: uv run pytest tests/unit/test_docs_relative_links.py -q

  - name: Architecture index contract
    command: uv run pytest tests/unit/test_architecture_index.py -q

  - name: Context documentation contract
    command: uv run pytest tests/unit/test_context_docs_contract.py -q

  - name: Canonical feature inventory sync
    command: uv run pytest tests/unit/test_canonical_inventory_sync.py -q

  - name: OKF docs unit tests
    command: uv run pytest tests/unit/test_docs_okf.py tests/unit/test_docs_verify.py tests/unit/test_generate_feature_docs.py tests/unit/test_demo_evidence_docs.py tests/unit/test_feature_doc_canonicality.py -q

eye:
  config: demos/technical/eye.toml
  screenshot_cmd: kestrel demo run technical
