[project]
name = "kestrel-storage-filebase"
version = "0.1.0"
description = "Filebase S3-compatible IPFS storage provider for Kestrel Sovereign"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kestrel-sovereign-sdk[crypto]",
    "boto3>=1.35.0",
    
]

[project.entry-points."kestrel_sovereign.storage_providers"]
FilebaseProvider = "kestrel_storage_filebase.filebase_provider:FilebaseProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["kestrel_storage_filebase"]
