# Talon Daemon Configuration — example
#
# On first run:
#   cp scripts/talon_daemon.example.toml scripts/talon_daemon.toml
#   $EDITOR scripts/talon_daemon.toml      # set repo_dir paths for your machine
#
# scripts/talon_daemon.toml is gitignored — keep your edits local.

[daemon]
poll_interval = 300          # 5 minutes between polls
cooldown = 60                # 1 minute between issues (KV cache turnover)
backend = "codex"            # "codex" (ChatGPT/Codex OAuth), "claude", or "opencode"
model = "gpt-5.5"            # Set "" to use backend default instead of pinning
auth_lane = "oauth"          # "oauth", "api_key" for Claude API billing, or "provider_config"
opencode_model = "kimi-local/kimi-k2.5"  # Legacy alias when backend=opencode
gh_user = "your-github-username"
max_daily_issues = 50
worktree = true              # Process in isolated worktrees
skip_clarification = true    # Skip analysis phase, go straight to implementation
self_review = true           # Review diff for wiring bugs before commit
verbose = false              # Set true to stream agent output to stderr

# Pause processing: touch /tmp/talon-daemon-pause
# Resume: rm /tmp/talon-daemon-pause

[[repos]]
repo = "OWNER/kestrel-sovereign"
repo_dir = "/absolute/path/to/your/kestrel-sovereign/checkout"
label = "enhancement"
quality_checks = ["./run_tests.py --unit --skip-check"]
max_iterations = 1
max_turns = 50

[[repos]]
repo = "OWNER/frinz"
repo_dir = "/absolute/path/to/your/frinz/checkout"
label = "enhancement"
quality_checks = ["uv run pytest tests/ -x --timeout=60"]
max_iterations = 1
max_turns = 50
