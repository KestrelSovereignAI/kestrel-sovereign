# Size tiers — vendor-canonical "small / medium / large" pointers.
# Tests, demos, and selection logic that want "the cheap model" or "the big
# model" without baking in a specific version reference these tiers. When a
# vendor releases a new generation, update this section in ONE place rather
# than chasing version numbers across the codebase. Pythonland code is
# forbidden from hardcoding model IDs (feedback_no_hardcoded_models) — this
# section is the discovery seam for size-based selection.
[size_tiers.anthropic]
small  = "claude-haiku-4-5-20251001"
medium = "claude-sonnet-4-6"
large  = "claude-opus-4-5-20251101"  # only opus with 1M context entry today

[size_tiers.openai]
small  = "gpt-5-nano"
medium = "gpt-5-mini"
large  = "gpt-5"

[size_tiers.ollama]
small  = "phi3:3.8b"
medium = "qwen2.5:7b"
large  = "qwen2.5:14b"
