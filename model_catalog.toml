# Model Catalog — Manual Overrides Only
#
# Everything else (model lists, display names, featured status) comes from
# API discovery and is cached in model_discovery_cache.json.
#
# This file contains ONLY data that APIs don't provide reliably.

# Hidden models (truly broken/useless — won't show even in "Show More")
# Keep this minimal — old models are still useful for some users
[hidden]
openai = ["babbage-002", "davinci-002"]

# Category overrides — APIs don't consistently indicate chat vs embedding
# Models not listed here default to "chat"
[categories.embedding]
openai = ["text-embedding-3-small", "text-embedding-3-large", "text-embedding-ada-002"]
ollama = ["nomic-embed-text", "mxbai-embed-large", "all-minilm"]

[categories.image]
openai = ["dall-e-3", "dall-e-2"]

[categories.audio]
openai = ["whisper-1", "tts-1", "tts-1-hd"]

# Context limit overrides (tokens)
# ONLY for providers whose APIs don't return context window sizes:
#   - OpenAI: no context_length in /v1/models response
#   - Anthropic: no context_length in API
#   - Ollama: doesn't expose context in list, only in /api/show
#
# DO NOT add entries for providers that return this from their API:
#   - OpenRouter: returns context_length per model
#   - Google/Vertex AI: returns context window in API response
[context_limits_override]
