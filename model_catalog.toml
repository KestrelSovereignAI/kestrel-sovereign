# Model Catalog — Manual Overrides Only
#
# Everything else (model lists, display names, featured status) comes from
# API discovery and is cached in model_discovery_cache.json.
#
# This file contains ONLY data that APIs don't provide reliably.

# Hidden models (emergency override only — empty in the common case).
# Visibility is discovery-driven: capability signals + deprecation keywords +
# canonical-alias detection decide what's shown by default. Add an entry here
# only when the vendor's own metadata is wrong.
[hidden]
# openai = []

# Category overrides — APIs don't consistently indicate which endpoint a model
# belongs on. Anything listed here is filtered out of the chat dropdown.
[categories.embedding]
openai = ["text-embedding-3-small", "text-embedding-3-large", "text-embedding-ada-002"]
ollama = ["nomic-embed-text", "mxbai-embed-large", "all-minilm"]

[categories.image]
openai = ["dall-e-3", "dall-e-2"]

[categories.audio]
openai = ["whisper-1", "tts-1", "tts-1-hd"]

# Legacy base-completion models (pre-chat API). They appear in /v1/models but
# only accept /v1/completions, so they don't belong in the chat dropdown.
[categories.completion]
openai = ["babbage-002", "davinci-002"]

# Context limit overrides (tokens)
# ONLY for providers whose APIs don't return context window sizes:
#   - OpenAI: no context_length in /v1/models response
#   - Anthropic: no context_length in API
#   - Ollama: doesn't expose context in list, only in /api/show
#
# DO NOT add entries for providers that return this from their API:
#   - OpenRouter: returns context_length per model
#   - Google/Vertex AI: returns context window in API response
[context_limits_override]
# Route-level per-turn payload caps. Listed FIRST so the longest-substring
# rule in ModelCatalogService.get_context_limit picks the route entry over
# any bare-model entry when both could apply. ChatGPT-subscription
# (openai:plan) has a per-turn payload cap well below the model's own
# context window — without this cap, ContextManager would size history
# against the model's 128K+ window and codex's session_loop would never
# return response.completed (the 300s idle-timeout symptom that #1395
# tracks). Tunable per deployment via env var
# KESTREL_OPENAI_PLAN_CONTEXT_CAP (read by ModelCatalogService.load).
"openai:plan" = 20480

