[project]
name = "kestrel-feature-github"
version = "0.1.0"
description = "Kestrel GitHub integration feature"
requires-python = ">=3.11"
dependencies = [
    "kestrel-sovereign-sdk @ git+https://github.com/KestrelSovereignAI/kestrel-sovereign-sdk.git",
    "aiosqlite>=0.21.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.entry-points."kestrel_sovereign.features"]
GitHubFeature = "kestrel_feature_github:GitHubFeature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["kestrel_feature_github"]
