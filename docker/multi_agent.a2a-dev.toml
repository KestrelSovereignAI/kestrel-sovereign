[host]
port = 8080
bind = "0.0.0.0"

[agents.Kestrel]
data_dir = "/app/agent_data/Kestrel"
port = 8801
autostart = true

[agents.kestrel-demo]
data_dir = "/app/agent_data/kestrel-demo"
port = 8802
autostart = true
features = [
    "BootstrapFeature", "MemoryFeature", "VoiceFeature", "ContextFeature",
    "HeartbeatFeature", "SaveFeature", "TaskFeature",
]

[agents.kestrel-a2a-peer]
data_dir = "/app/agent_data/kestrel-a2a-peer"
port = 8803
autostart = true
features = ["BootstrapFeature", "MemoryFeature", "TaskFeature"]

[demo_seeds.kestrel-demo]
did = "did:web:agents.kestrelsovereign.com:kestrel-dev-a2a"
database = "/var/run/kestrel-demo-seed/state/kestrel_prime.db.xz"
identity = "/var/run/kestrel-demo-seed/identity/identity.json"

[demo_seeds.kestrel-a2a-peer]
did = "did:web:agents.kestrelsovereign.com:kestrel-dev-a2a-peer"
database = "/var/run/kestrel-demo-seed/peer-state/kestrel_prime.db.xz"
identity = "/var/run/kestrel-demo-seed/peer-identity/identity.json"
soul = "/app/docker/a2a-dev-peer.SOUL.md"
