# Cloud Build: Kestrel IPFS node (Kubo + GCS datastore plugin)
#
# Builds a custom Kubo image that stores IPFS blocks in Google Cloud Storage.
#
# Usage:
#   gcloud builds submit --config=docker/cloudbuild-ipfs.yaml docker/ipfs/
#
# Or with substitutions:
#   gcloud builds submit --config=docker/cloudbuild-ipfs.yaml \
#     --substitutions=_TAG=v1 docker/ipfs/

substitutions:
  _TAG: latest
  _IMAGE: kestrel-ipfs-gcs

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_IMAGE}:${_TAG}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_IMAGE}:latest'
      - '-f'
      - 'Dockerfile.gcs'
      - '.'
    timeout: 1800s

images:
  - 'gcr.io/${PROJECT_ID}/${_IMAGE}:${_TAG}'
  - 'gcr.io/${PROJECT_ID}/${_IMAGE}:latest'

options:
  diskSizeGb: 20

timeout: 1800s
