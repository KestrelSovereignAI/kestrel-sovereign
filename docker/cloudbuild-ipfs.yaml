# Cloud Build configuration for SimpleTuner with IPFS support
# Builds and pushes to gcr.io/YOUR_PROJECT_ID/kestrel-lora with multiple tags
#
# Usage:
#   cd ./
#   gcloud builds submit --config=docker/cloudbuild-ipfs.yaml .
#
# Tags:
#   :ipfs-v1 - IPFS generation work (Lighthouse gateway default)
#   :v2      - Training work (/workspace paths, no fallbacks)
#   :latest  - Shared default

steps:
  # Build the SimpleTuner image with all three tags
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/YOUR_PROJECT_ID/kestrel-lora:ipfs-v1'
      - '-t'
      - 'gcr.io/YOUR_PROJECT_ID/kestrel-lora:v2'
      - '-t'
      - 'gcr.io/YOUR_PROJECT_ID/kestrel-lora:latest'
      - '-f'
      - 'docker/Dockerfile.simpletuner'
      - '.'
    timeout: 3600s  # 1 hour for large image

  # Push all tags
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/YOUR_PROJECT_ID/kestrel-lora:ipfs-v1'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/YOUR_PROJECT_ID/kestrel-lora:v2'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/YOUR_PROJECT_ID/kestrel-lora:latest'

images:
  - 'gcr.io/YOUR_PROJECT_ID/kestrel-lora:ipfs-v1'
  - 'gcr.io/YOUR_PROJECT_ID/kestrel-lora:v2'
  - 'gcr.io/YOUR_PROJECT_ID/kestrel-lora:latest'

options:
  machineType: 'E2_HIGHCPU_32'  # Faster build
  diskSizeGb: 200  # Large disk for CUDA image

timeout: 7200s  # 2 hour total timeout
