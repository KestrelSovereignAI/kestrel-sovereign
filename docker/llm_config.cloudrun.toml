# LLM configuration for Cloud Run deployment.
# Vendor/route/model architecture — see docs/architecture/LLM_SERVICE_ARCHITECTURE.md
# Cloud-only: no Claude Max OAuth, no local llama_cpp, no local ollama.

route_priority = [
    "anthropic:api",
    "openai:api",
    "vertex_ai:api",
]


# =============================================================================
# Anthropic
# =============================================================================

[vendors.anthropic]
is_cloud = true

[vendors.anthropic.routes.api]
adapter         = "AnthropicAdapter"
api_key_env     = "ANTHROPIC_API_KEY"
model           = "auto"
selection_hints = ["sonnet", "haiku", "opus"]


# =============================================================================
# OpenAI
# =============================================================================

[vendors.openai]
is_cloud = true

[vendors.openai.routes.api]
adapter         = "OpenAIAdapter"
api_key_env     = "OPENAI_API_KEY"
model           = "auto"
selection_hints = ["gpt-5", "gpt-4"]


# =============================================================================
# Google Vertex AI / AI Studio (Gemini)
# =============================================================================

[vendors.vertex_ai]
is_cloud = true

[vendors.vertex_ai.routes.api]
adapter         = "VertexAIAdapter"
api_key_env     = "GOOGLE_API_KEY"
model           = "auto"
selection_hints = ["gemini", "pro", "flash"]
