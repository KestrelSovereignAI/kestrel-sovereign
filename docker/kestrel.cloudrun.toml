# Kestrel unified configuration for Cloud Run deployment.
# Vendor/route/model architecture — see docs/architecture/LLM_SERVICE_ARCHITECTURE.md
# Cloud-only: no Claude Max OAuth, no local llama_cpp, no local ollama.
#
# This file is copied to /app/kestrel.toml during the Docker build (see
# docker/Dockerfile.cloudrun and docker/Dockerfile.multi_agent). LLMService reads
# the [llm] section directly via load_section("llm").

[llm]
route_priority = [
    "anthropic:api",
    "openai:api",
    "vertex_ai:api",
]


# =============================================================================
# Anthropic
# =============================================================================

[llm.vendors.anthropic]
is_cloud = true

[llm.vendors.anthropic.routes.api]
adapter         = "AnthropicAdapter"
api_key_env     = "ANTHROPIC_API_KEY"
model           = "auto"
selection_hints = ["sonnet", "haiku", "opus"]


# =============================================================================
# OpenAI
# =============================================================================

[llm.vendors.openai]
is_cloud = true

[llm.vendors.openai.routes.api]
adapter         = "OpenAIAdapter"
api_key_env     = "OPENAI_API_KEY"
model           = "auto"
selection_hints = ["gpt-5", "gpt-4"]


# =============================================================================
# Google Vertex AI / AI Studio (Gemini)
# =============================================================================

[llm.vendors.vertex_ai]
is_cloud = true

[llm.vendors.vertex_ai.routes.api]
adapter         = "VertexAIAdapter"
api_key_env     = "GOOGLE_API_KEY"
model           = "auto"
selection_hints = ["gemini", "pro", "flash"]
