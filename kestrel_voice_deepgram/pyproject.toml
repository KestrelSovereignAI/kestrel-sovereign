[project]
name = "kestrel-voice-deepgram"
version = "0.1.0"
description = "Deepgram STT voice provider for Kestrel Sovereign"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kestrel-sovereign-sdk",
    "deepgram-sdk>=4.0.0",
]

[project.entry-points."kestrel_sovereign.voice_providers"]
DeepgramSTT = "kestrel_voice_deepgram.deepgram_stt:DeepgramSTTProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["kestrel_voice_deepgram"]
