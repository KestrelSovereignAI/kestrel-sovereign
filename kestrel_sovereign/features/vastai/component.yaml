name: vastai
description: Vast.ai GPU instance management - search, start, stop instances for training, inference, and compute workloads
version: 1.0.0
entry_point: feature.py

tools:
  - manage_vastai

commands:
  - "!vastai status"
  - "!vastai search"
  - "!vastai on"
  - "!vastai off"
  - "!vastai list"
  - "!vastai ssh"

files:
  - feature.py
  - vastai_manager.py
  - __init__.py

config_files:
  - vastai_config.toml

dependencies:
  - vastai-sdk

environment:
  - VASTAI_API_KEY
  - VASTAI_DEFAULT_TTL_SECONDS
  - HF_TOKEN
