name: council
version: 1.0.0
description: Constitutional Council - Multi-model deliberation for major decisions

feature_class: features.council.feature.CouncilFeature

dependencies:
  - llm  # For model adapters

tools:
  - name: council_convene
    command: "!council-convene"
    description: Convene the Constitutional Council to deliberate on a question

  - name: council_status
    command: "!council-status"
    description: View status of council sessions

  - name: council_override
    command: "!council-override"
    description: Apply a human override to a council decision

  - name: council_members
    command: "!council-members"
    description: List configured council members

  - name: council_evidence
    command: "!council-evidence"
    description: Preview the evidence package for a council session

config_file: council_config.toml

tags:
  - governance
  - multi-model
  - consensus
  - constitutional
