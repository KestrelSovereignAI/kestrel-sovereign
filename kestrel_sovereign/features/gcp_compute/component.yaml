name: gcp_compute
description: GCP Compute Engine GPU instance management - start, stop instances for training, inference with persistent disk support
version: 1.0.0
entry_point: feature.py

tools:
  - manage_gcp

commands:
  - "!gcp status"
  - "!gcp on"
  - "!gcp off"
  - "!gcp list"
  - "!gcp disks"

files:
  - feature.py
  - gcp_compute_manager.py
  - __init__.py

config_files:
  - gcp_compute_config.toml

dependencies:
  - google-cloud-compute

environment:
  - GOOGLE_APPLICATION_CREDENTIALS
  - GCP_SERVICE_ACCOUNT_KEY
  - GCP_PROJECT_ID
  - GCP_DEFAULT_TTL_SECONDS
  - GCP_PREFER_SPOT
  - HF_TOKEN
