# Model Catalog - Featured models per provider
# These appear in the default "featured" view
# Update this file to change featured models without code changes

[featured]
openai = [
    "gpt-5.1",
    "gpt-5-mini",
    "gpt-5-nano",
]

anthropic = [
    "claude-sonnet-4-5-20250929",
    "claude-haiku-4-5-20251001",
    "claude-opus-4-5-20251101",
]

ollama = [
    "llama3.2",
    "gpt-oss:20b",
    "deepseek-r1:14b",
    "qwen2.5:14b",
    "phi4",
]

vertex_ai = [
    "gemini-3-pro",
    "gemini-2.5-flash",
    "gemini-2.5-pro",
]

google = [
    "gemini-3-pro",
    "gemini-2.5-flash",
]

xai = [
    "grok-4-1-fast-non-reasoning",
]

runpod = [
    "meta-llama/Llama-3.1-8B-Instruct",
]

# OpenRouter featured models (from actual API discovery)
openrouter = [
    # Anthropic
    "anthropic/claude-opus-4.5",
    "anthropic/claude-sonnet-4.5",
    "anthropic/claude-3.5-sonnet",
    # OpenAI
    "openai/gpt-5.2",
    "openai/gpt-5.1",
    "openai/gpt-4o",
    "openai/o3-mini",
    # Google
    "google/gemini-3-pro-preview",
    "google/gemini-2.5-pro",
    "google/gemini-2.5-flash",
    # DeepSeek
    "deepseek/deepseek-r1",
    "deepseek/deepseek-v3.2",
    "deepseek/deepseek-chat-v3.1",
    # Meta
    "meta-llama/llama-3.1-405b-instruct",
    "meta-llama/llama-3.1-70b-instruct",
]

# Display name overrides (optional, only when API doesn't provide good names)
[display_names]
"claude-sonnet-4-5-20250929" = "Claude Sonnet 4.5"
"claude-haiku-4-5-20251001" = "Claude Haiku 4.5"
"claude-opus-4-5-20251101" = "Claude Opus 4.5"

# Model categories - since APIs don't consistently indicate chat vs embedding
# Models not listed here default to "chat"
[categories.embedding]
openai = ["text-embedding-3-small", "text-embedding-3-large", "text-embedding-ada-002"]
ollama = ["nomic-embed-text", "mxbai-embed-large", "all-minilm"]

[categories.image]
openai = ["dall-e-3", "dall-e-2"]

[categories.audio]
openai = ["whisper-1", "tts-1", "tts-1-hd"]

# Hidden models (truly broken/useless - won't show even in "Show More")
# Keep this minimal - old models are still useful for some users
[hidden]
openai = ["babbage-002", "davinci-002"]

# Context window overrides (tokens) - Used by token budget allocation
# Only list models whose limits DIFFER from family defaults in token_counter.py.
# Most models are covered by family patterns (claude-* -> 200K, gemini-* -> 1M, etc.)
# and by API discovery (Google, Vertex AI, OpenRouter return limits automatically).
[context_limits]
"gpt-4-32k" = 32768          # gpt-4 family default is 8192
"gpt-5-nano" = 32000         # gpt-5 family default is 128000
"claude-opus-4-5-20251101" = 1000000  # claude- family default is 200000
"gemini-3-pro" = 2000000     # gemini- family default is 1000000
"phi3:3.8b" = 4096           # phi family default is 16384
"gemma2:9b" = 8192           # no family match, explicit override
"qwen2.5:14b" = 128000       # qwen family default is 32768
"meta-llama/Llama-3.1-8B-Instruct" = 128000  # slash in name, won't match llama prefix
