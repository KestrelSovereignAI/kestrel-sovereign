# Kestrel Feature Registry
#
# Static catalog of all feature packages. Maps user-friendly names to packages,
# class names, and git URLs. Consumed by CLI, API, and Feature Store UI.
#
# Status levels (computed at runtime by feature_registry.py):
#   available  - listed here but not installed
#   installed  - installed via entry_point but not enabled for this agent
#   enabled    - loaded and active for this agent
#   disabled   - explicitly disabled via KESTREL_DISABLED_FEATURES
#
# Each feature entry supports:
#   package     - pip package name
#   git         - source repository URL
#   features    - list of Feature class names in this package
#   description - human-readable summary
#   tags        - list of tags for filtering
#   icon        - icon identifier for UI rendering
#   core        - true if shipped with kestrel-sovereign (not a separate package)
#   skills      - per-feature skill declarations for static discovery

