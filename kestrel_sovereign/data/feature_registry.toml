# Kestrel Feature Registry
#
# Static catalog of Kestrel capabilities and related install targets. Every row
# has exactly one package boundary:
#   bundled          - Feature lifecycle class discovered from this distribution
#                      under kestrel_sovereign/features; no separate install
#   bundled-component - non-Feature runtime component shipped in this
#                       distribution; no separate install
#   feature-package  - independently installed distribution that registers
#                      Feature lifecycle classes under kestrel_sovereign.features
#   provider-package - independently installed backend implementation registered
#                      under one or more provider-specific entry-point groups
#   standalone-tool  - independent command/control surface with no Feature or
#                      provider entry point (it may be related by `companion`)
#
# Status levels (computed at runtime by feature_registry.py):
#   available  - listed here but not installed / not bundled
#   installed  - bundled with kestrel-sovereign or installed via entry_point,
#                but not enabled for this agent
#   enabled    - loaded and active for this agent
#   disabled   - explicitly disabled via KESTREL_DISABLED_FEATURES
#
# Each feature entry supports:
#   boundary    - one of the package-boundary values above (required)
#   package     - distribution that OWNS this row and is installed for it;
#                 never the name of a merely related package
#   git         - source repository URL
#   features    - Feature lifecycle class names; bundled/feature-package only
#   bundled_components - shipped non-Feature class names; bundled-component only
#   provider_classes   - provider implementation class names; providers only
#   entry_point_groups - provider-specific groups; providers only
#   command     - installed executable name; standalone tools only
#   provider_for - related registry ID whose provider contract is implemented
#   companion   - separately named related standalone-tool registry ID
#   description - human-readable summary
#   tags        - list of tags for filtering
#   icon        - icon identifier for UI rendering
#   core        - compatibility field for existing CLI/API/UI consumers; it MUST
#                 be true exactly for bundled/bundled-component rows, and false
#                 otherwise
#   skills      - per-feature skill declarations for static discovery

