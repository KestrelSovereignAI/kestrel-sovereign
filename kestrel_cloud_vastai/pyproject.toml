[project]
name = "kestrel-cloud-vastai"
version = "0.1.0"
description = "Vast.ai GPU marketplace cloud provider for Kestrel Sovereign"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kestrel-sovereign-sdk @ git+https://github.com/KestrelSovereignAI/kestrel-sovereign-sdk.git",
    # Cross-feature: llm.service, config (not in SDK)
    "kestrel-sovereign @ git+https://github.com/KestrelSovereignAI/kestrel-sovereign.git",
    "vastai-sdk>=0.1.0",
]

[project.entry-points."kestrel_sovereign.features"]
VastAIFeature = "kestrel_cloud_vastai.feature:VastAIFeature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["kestrel_cloud_vastai"]
