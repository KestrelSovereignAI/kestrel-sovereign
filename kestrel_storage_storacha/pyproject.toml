[project]
name = "kestrel-storage-storacha"
version = "0.1.0"
description = "Storacha (web3.storage) storage provider for Kestrel Sovereign"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kestrel-sovereign-sdk[crypto]",
    "httpx>=0.27.0",
    "cbor2>=5.6.0",
    
]

[project.entry-points."kestrel_sovereign.storage_providers"]
StorachaProvider = "kestrel_storage_storacha.storacha_provider:StorachaProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["kestrel_storage_storacha"]
