[project]
name = "kestrel_sovereign"
version = "0.1.8"
description = "Kestrel Sovereign AI Agent Framework - Constitutional AI with cryptographic identity"
requires-python = ">=3.11"
dependencies = [
    # Core web framework
    "fastapi==0.116.0",
    "uvicorn==0.35.0",
    "pydantic==2.11.7",
    # HTTP clients
    "aiohttp>=3.12.14",
    "httpx>=0.27.0",
    "requests==2.32.4",
    # Cloud LLM providers
    "openai==1.93.2",
    # Ollama client (lightweight API client, connects to host Ollama)
    "ollama>=0.6.1",
    # Database
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    # Cryptography
    "cryptography==45.0.5",
    "pycryptodome==3.23.0",
    # Auth and security
    "python-jose>=3.5.0",
    "slowapi>=0.1.9",
    "itsdangerous>=2.2.0",
    # Redis for caching
    "redis>=6.4.0",
    # Config and utilities
    "python-dotenv==1.1.1",
    "toml==0.10.2",
    # Email
    "resend>=2.19.0",
    "email-validator>=2.3.0",
    # Docker for MCP containers
    "docker>=7.1.0",
    # Image generation (lightweight API client)
    "replicate>=1.0.4",
    "pillow>=10.0.0",
    # Search
    "tavily-python>=0.3.0",
    # Token counting (lightweight)
    "tiktoken==0.9.0",
    # BM25 for hybrid search
    "rank_bm25>=0.2.2",
    # MCP protocol
    "mcp>=0.1.0",
    "trio>=0.32.0",
    # Web scraping (lightweight)
    "beautifulsoup4==4.13.4",
    # Graph operations (lightweight)
    "networkx==3.5",
    # Misc
    "certifi==2025.7.14",
    "charset-normalizer==3.4.2",
    "idna==3.10",
    "packaging==24.1",
    "urllib3==2.5.0",
    "pygments==2.19.2",
    "pluggy==1.6.0",
    "iniconfig==2.1.0",
    # Google auth for cloud deployments
    "google-auth>=2.40.3",
    # Google Vertex AI (unified SDK for Gemini API and Vertex AI)
    "google-genai>=1.0.0",
    # Google Cloud Compute Engine (for GPU instances)
    "google-cloud-compute>=1.15.0",
    # RunPod for GPU cloud
    "runpod>=1.8.1",
    # Vast.ai for GPU cloud (alternative to RunPod)
    "vastai-sdk>=0.1.0",
    # Multi-chain wallet (EVM transaction signing)
    "web3>=7.0.0",
    # Fiat on-ramp (Stripe Crypto On-Ramp)
    "stripe>=10.0.0",
    # Testing
    "pytest-asyncio>=1.1.0",
    "pytest-timeout>=2.3.1",
    "psutil>=7.1.3",
    "numpy>=2.3.1",
    "asgi-lifespan>=2.1.0",
    "anthropic>=0.75.0",
    "google-generativeai>=0.8.6",
    "lighthouseweb3>=0.1.6",
    "google-cloud-storage>=3.4.1",
    "safetensors>=0.7.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "torchaudio>=2.9.1",
    "diffusers>=0.36.0",
    "transformers>=4.57.1",
    "accelerate>=1.12.0",
    "peft>=0.18.1",
    "sendgrid>=6.12.4",
    "twilio>=9.9.1",
    # GitHub Ticket Processor
    "claude-agent-sdk>=0.1.0",
    "PyGithub>=2.1.0",
]

[project.optional-dependencies]
# Local LLM support (adds ~2GB+ for torch, sentence-transformers)
local = [
    "ollama>=0.6.1",
    "sentence-transformers==3.0.1",
    "spacy>=3.7.0",
    "chromadb==1.0.15",
    "langchain==0.3.26",
    "langchain-community==0.3.27",
    "numpy==2.3.1",
]
# Full installation (everything)
full = [
    "kestrel_sovereign[local]",
]

[project.scripts]
kestrel = "kestrel_cli:main"
kestrel-github = "kestrel_sovereign.github_processor.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",  # Parallel test execution
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
# Only run Kestrel tests from root - external apps have their own pytest config
testpaths = ["tests"]
norecursedirs = ["scripts", ".venv", "*.egg-info", ".git", "node_modules"]
addopts = "-x --tb=short"
markers = [
    "e2e: marks tests as end-to-end (slow)",
    "integration: marks tests as integration tests",
    "load: Load/stress tests (opt-in with --run-load)",
    "adversarial: Security/bypass attempt tests for constitutional protections",
    "dual_backend: Tests that run on both SQLite and PostgreSQL",
    "cloud_resource: Tests that use cloud resources (RunPod, GPU, etc)",
    "docker: Tests that require Docker",
    "docker_mcp: Tests that require Docker MCP Toolkit (excluded in CI)",
    "slow: Slow-running tests",
    "anyio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kestrel_sovereign"]

[tool.hatch.build.targets.sdist]
include = ["kestrel_sovereign/**/*"] 
