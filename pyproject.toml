[project]
name = "kestrel_sovereign"
version = "0.19.0"
description = "Kestrel Sovereign AI Agent Framework - Constitutional AI with cryptographic identity"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UncleSaurus" }]
maintainers = [{ name = "UncleSaurus" }]
keywords = [
    "ai",
    "agents",
    "sovereign",
    "constitutional-ai",
    "did",
    "cryptographic-identity",
    "open-source",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    # Extracted SDK — base interfaces/protocols/data models for feature packages.
    # Lives at https://github.com/KestrelSovereignAI/kestrel-sovereign-sdk and is
    # published independently to PyPI. The 35+ `from kestrel_sdk.*` imports across
    # kestrel_sovereign/ resolve against this installed package.
    # Bumped to >=0.11 in #1137 chunk 1A (PR sdk#12, published as v0.11.0)
    # to bring in the SourceRegistration constitutional-injection fields
    # (require_constitution_echo / prompt_template_format /
    # constitution_injection / system_prompt_budget_bytes) that chunks 1D,
    # 1F, and 1G consume. Defaults are backwards-compatible.
    #
    # 0.17.0 floor: adds the SDK-owned LLM provider capability contract.
    "kestrel-sovereign-sdk>=0.17.0,<1",
    # Core web framework
    "fastapi==0.136.3",
    "uvicorn==0.48.0",
    "pydantic==2.13.4",
    # HTTP clients
    "aiohttp>=3.13.3",
    "httpx>=0.27.0",
    "requests>=2.32.5",
    # Cloud LLM providers
    # >=2.0.0 required for the GA Realtime API surface
    # (``client.realtime`` replaces the deprecated ``client.beta.realtime``;
    # see kestrel-voice-openai #16).  Bounded below 3 because we haven't
    # validated against a hypothetical major bump.
    "openai>=2.0.0,<3",
    # Ollama client (lightweight API client, connects to host Ollama)
    "ollama>=0.6.1",
    # Database
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    # SQLAlchemy (used by the generic vector_search backends in
    # kestrel_sovereign.storage.vector — feature packages already pull this
    # transitively; promoted to a direct dep so the sovereign vector module
    # can ship without depending on a feature pkg being installed).
    "sqlalchemy[asyncio]>=2.0",
    # pgvector Python bindings (registers the Vector column type +
    # cosine-distance operator on SQLAlchemy's expression language). Only
    # exercised at runtime on Postgres dialects; the Python import itself is
    # safe on SQLite.
    "pgvector>=0.3.0",
    # Cryptography
    "cryptography>=45.0.5",
    "pycryptodome==3.23.0",
    # Auth and security
    "PyJWT[crypto]>=2.8.0",
    "slowapi>=0.1.9",
    "itsdangerous>=2.2.0",
    "authlib>=1.3.0",
    # Redis for caching
    "redis>=6.4.0",
    # Config and utilities
    "python-dotenv==1.2.2",
    "toml==0.10.2",
    "PyYAML>=6.0",
    # Interactive setup wizard prompts
    "questionary>=2.0.1",
    # Email validation
    "email-validator>=2.3.0",
    # Form data parsing (required by FastAPI for file uploads)
    "python-multipart>=0.0.20",
    # Image processing
    "pillow>=12.1.1",
    # Token counting (lightweight)
    "tiktoken>=0.13.0,<1",
    # BM25 for hybrid search
    "rank_bm25>=0.2.2",
    # Web scraping (lightweight)
    "beautifulsoup4==4.14.3",
    # Graph operations (lightweight)
    "networkx==3.6.1",
    # Misc
    "certifi==2026.5.20",
    "charset-normalizer==3.4.7",
    "idna==3.16",
    "packaging==26.2",
    "urllib3>=2.6.3",
    "pygments==2.20.0",
    "pluggy==1.6.0",
    "iniconfig==2.3.0",
    # Google auth for cloud deployments
    "google-auth>=2.40.3",
    # Google Vertex AI (unified SDK for Gemini API and Vertex AI)
    "google-genai>=1.0.0",
    "google-cloud-logging>=3.5.0",
    # GCP Secret Manager (used by ``kestrel deploy secrets sync`` to push
    # local .env values into Secret Manager — port of
    # scripts/cloudrun/setup_secrets.sh from epic #1050).
    "google-cloud-secret-manager>=2.20.0",
    # Runtime utilities
    "psutil>=7.1.3",
    "numpy>=2.3.1",
    # CAR file support (sovereignty exports)
    "cbor2>=5.6.0",
    # LLM provider SDKs (used at runtime via dynamic import)
    "anthropic>=0.75.0",
    "google-generativeai>=0.8.6",
    "google-cloud-storage>=3.4.1",
    "pqcrypto>=0.4.0",
    "kestrel-llms[all]==0.1.8",
]

[project.urls]
Homepage = "https://kestrelsovereign.com"
Source = "https://github.com/KestrelSovereignAI/kestrel-sovereign"
Issues = "https://github.com/KestrelSovereignAI/kestrel-sovereign/issues"
Documentation = "https://github.com/KestrelSovereignAI/kestrel-sovereign/blob/main/README.md"
Discussions = "https://github.com/KestrelSovereignAI/kestrel-sovereign/discussions"

[project.optional-dependencies]
# Test dependencies (not needed in production)
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.1.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.0.0",
    "asgi-lifespan>=2.1.0",
]
# ML/training dependencies (adds ~2GB+ for torch, diffusers, etc.)
ml = [
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "torchaudio>=2.9.1",
    "diffusers>=0.36.0",
    "transformers>=4.57.1",
    "accelerate>=1.12.0",
    "peft>=0.18.1",
    "safetensors>=0.7.0",
]
# Local LLM support (adds ~2GB+ for torch, sentence-transformers)
local = [
    "ollama>=0.6.1",
    "sentence-transformers==5.5.1",
    "spacy>=3.7.0",
    "chromadb==1.5.9",
    "langchain>=0.3.31",
    "langchain-community>=0.3.31",
    "numpy==2.4.6",
]
# Observability (OpenTelemetry tracing + Prometheus metrics)
# Prometheus support comes via the SDK's [metrics] extra; OpenTelemetry
# is local to the framework's own tracing.
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "kestrel-sovereign-sdk[metrics]>=0.11,<1",
]
# Feature: Cloud GPU/serverless deployment (Azure only now)
# Note: GCP Compute Engine, Vast.ai, and RunPod support are in the
# extracted kestrel-cloud-gcp / kestrel-cloud-vastai / kestrel-cloud-runpod
# packages (#462). google-cloud-run stays here because the framework's
# deploy feature still owns CloudRunProvider directly.
cloud = [
    "google-cloud-run>=0.10.0",
    "azure-mgmt-appcontainers>=3.0.0",
    "azure-identity>=1.15.0",
]
# Feature: Wallet (web3, Stripe, CBOR for CAR files)
wallet = [
    "web3>=7.0.0",
    "stripe>=10.0.0",
]
# Feature: Delivery (email/SMS notifications)
delivery = [
    "resend>=2.19.0",
    "sendgrid>=6.12.5",
    "twilio>=9.9.1",
]
# Feature: Search (Tavily web search)
search = [
    "tavily-python>=0.3.0",
]
# Note on extracted feature packages:
# Out-of-tree feature packages (kestrel-feature-mcp, kestrel-talon, the
# kestrel-cloud-* / kestrel-storage-* / kestrel-voice-* family, etc.) are
# installed independently — `pip install kestrel-feature-mcp` adds MCP
# support and registers itself via the `kestrel_sovereign.features`
# entry-point group at startup. The framework deliberately doesn't list
# those packages here as optional-deps, because doing so inverts the
# open-core dependency direction (framework → feature instead of
# feature → framework).
#
# All feature packages — restores pre-split behavior
all-features = [
    "kestrel_sovereign[cloud]",
    "kestrel_sovereign[wallet]",
    "kestrel_sovereign[delivery]",
    "kestrel_sovereign[search]",
    "kestrel_sovereign[local]",
    "kestrel_sovereign[ml]",
    "kestrel_sovereign[observability]",
]
# Full installation (everything including test and dev tools)
full = [
    "kestrel_sovereign[all-features]",
    "kestrel_sovereign[test]",
]

[project.scripts]
kestrel = "kestrel_sovereign.cli:main"

[project.entry-points.pytest11]
kestrel = "kestrel_sovereign.testing.fixtures"

# Entry points for external feature packages (when properly extracted)
# Features in sovereign are discovered locally via features/__init__.py
# These groups are scanned for packages installed via pip
[project.entry-points."kestrel_sovereign.features"]
[project.entry-points."kestrel_sovereign.cloud_providers"]
[project.entry-points."kestrel_sovereign.voice_providers"]
[project.entry-points."kestrel_sovereign.storage_providers"]

[dependency-groups]
dev = [
    {include-group = "test"},
]

# Mirror of [project.optional-dependencies.test] for uv sync compatibility
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.1.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.0.0",
    "asgi-lifespan>=2.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
# Only run Kestrel tests from root - external apps have their own pytest config
testpaths = ["tests"]
norecursedirs = ["scripts", ".venv", "*.egg-info", ".git", "node_modules"]
addopts = "-x --tb=short"
markers = [
    "e2e: marks tests as end-to-end (slow)",
    "integration: marks tests as integration tests",
    "load: Load/stress tests (opt-in with --run-load)",
    "adversarial: Security/bypass attempt tests for constitutional protections",
    "dual_backend: Tests that run on both SQLite and PostgreSQL",
    "cloud_resource: Tests that use cloud resources (RunPod, GPU, etc)",
    "docker: Tests that require Docker",
    "docker_mcp: Tests that require Docker MCP Toolkit (excluded in CI)",
    "slow: Slow-running tests",
    "bench: Performance benchmarks (excluded from default CI)",
    "anyio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

# Only the in-repo package. The kestrel_feature_*, kestrel_voice_*, and
# kestrel_cloud_* packages used to be listed here from the pre-extraction
# era — they live in their own repos now and ship as separate distributions
# discovered via the `kestrel_sovereign.features` entry-point group.
# Hatchling silently skipped the missing dirs at build time so the
# published wheel was always correct; the listing was just misleading.
# Caught in the Noel post-launch review (2026-05-06).
packages = ["kestrel_sovereign"]

[tool.hatch.build.targets.sdist]
include = ["kestrel_sovereign/**/*"]
