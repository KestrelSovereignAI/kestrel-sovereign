[project]
name = "kestrel_sovereign"
version = "0.1.8"
description = "Kestrel Sovereign AI Agent Framework - Constitutional AI with cryptographic identity"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Core web framework
    "fastapi==0.128.1",
    "uvicorn==0.35.0",
    "pydantic==2.12.5",
    # HTTP clients
    "aiohttp>=3.13.3",
    "httpx>=0.27.0",
    "requests>=2.32.5",
    # Cloud LLM providers
    "openai==1.93.2",
    # Ollama client (lightweight API client, connects to host Ollama)
    "ollama>=0.6.1",
    # Database
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    # Cryptography
    "cryptography>=45.0.5",
    "pycryptodome==3.23.0",
    # Auth and security
    "PyJWT[crypto]>=2.8.0",
    "slowapi>=0.1.9",
    "itsdangerous>=2.2.0",
    "authlib>=1.3.0",
    # Redis for caching
    "redis>=6.4.0",
    # Config and utilities
    "python-dotenv==1.1.1",
    "toml==0.10.2",
    "PyYAML>=6.0",
    # Email validation
    "email-validator>=2.3.0",
    # Form data parsing (required by FastAPI for file uploads)
    "python-multipart>=0.0.20",
    # Image processing
    "pillow>=12.1.1",
    # Token counting (lightweight)
    "tiktoken==0.9.0",
    # BM25 for hybrid search
    "rank_bm25>=0.2.2",
    # Web scraping (lightweight)
    "beautifulsoup4==4.13.4",
    # Graph operations (lightweight)
    "networkx==3.5",
    # Misc
    "certifi==2026.1.4",
    "charset-normalizer==3.4.4",
    "idna==3.11",
    "packaging==24.1",
    "urllib3>=2.6.3",
    "pygments==2.19.2",
    "pluggy==1.6.0",
    "iniconfig==2.1.0",
    # Google auth for cloud deployments
    "google-auth>=2.40.3",
    # Google Vertex AI (unified SDK for Gemini API and Vertex AI)
    "google-genai>=1.0.0",
    "google-cloud-logging>=3.5.0",
    # Feature packages (extracted)
    "kestrel-feature-github",
    # Runtime utilities
    "psutil>=7.1.3",
    "numpy>=2.3.1",
    # CAR file support (sovereignty exports)
    "cbor2>=5.6.0",
    # LLM provider SDKs (used at runtime via dynamic import)
    "anthropic>=0.75.0",
    "google-generativeai>=0.8.6",
    "google-cloud-storage>=3.4.1",
]

[project.optional-dependencies]
# Test dependencies (not needed in production)
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.1.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.0.0",
    "asgi-lifespan>=2.1.0",
]
# ML/training dependencies (adds ~2GB+ for torch, diffusers, etc.)
ml = [
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "torchaudio>=2.9.1",
    "diffusers>=0.36.0",
    "transformers>=4.57.1",
    "accelerate>=1.12.0",
    "peft>=0.18.1",
    "safetensors>=0.7.0",
]
# Local LLM support (adds ~2GB+ for torch, sentence-transformers)
local = [
    "ollama>=0.6.1",
    "sentence-transformers==3.0.1",
    "spacy>=3.7.0",
    "chromadb==1.0.15",
    "langchain>=0.3.31",
    "langchain-community>=0.3.31",
    "numpy==2.3.1",
]
# Voice (TTS/STT) — local + cloud providers
voice = [
    "elevenlabs>=1.0.0",
    "piper-tts>=1.2.0",
    "soundfile>=0.13.0",
    "faster-whisper>=1.1.0",
    "deepgram-sdk>=4.0.0",
    "webrtcvad>=2.0.10",
]
# Observability (OpenTelemetry tracing + Prometheus metrics)
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "prometheus-client>=0.21.0",
]
# Feature: Cloud GPU/serverless deployment (RunPod, Vast.ai, GCP, Azure)
cloud = [
    "runpod>=1.8.1",
    "vastai-sdk>=0.1.0",
    "google-cloud-compute>=1.15.0",
    "google-cloud-run>=0.10.0",
    "azure-mgmt-appcontainers>=3.0.0",
    "azure-identity>=1.15.0",
]
# Feature: Wallet (web3, Stripe, CBOR for CAR files)
wallet = [
    "web3>=7.0.0",
    "stripe>=10.0.0",
]
# Feature: MCP (Docker container management, MCP protocol)
mcp = [
    "docker>=7.1.0",
    "mcp>=1.26.0",
    "trio>=0.32.0",
]
# Feature: Visual (image generation via Replicate)
visual = [
    "replicate>=1.0.4",
]
# Feature: Delivery (email/SMS notifications)
delivery = [
    "resend>=2.19.0",
    "sendgrid>=6.12.5",
    "twilio>=9.9.1",
]
# Feature: GitHub issue processing
github = [
    "kestrel-talon @ git+https://github.com/KestrelSovereignAI/kestrel-talon.git",
]
# Feature: Search (Tavily web search)
search = [
    "tavily-python>=0.3.0",
]
# Feature: Intelligence (reflection + council metacognition)
intelligence = [
    "kestrel-feature-intelligence @ {root:uri}/kestrel-feature-intelligence",
]
# All feature packages — restores pre-split behavior
all-features = [
    "kestrel_sovereign[cloud]",
    "kestrel_sovereign[wallet]",
    "kestrel_sovereign[mcp]",
    "kestrel_sovereign[visual]",
    "kestrel_sovereign[delivery]",
    "kestrel_sovereign[github]",
    "kestrel_sovereign[search]",
    "kestrel_sovereign[intelligence]",
    "kestrel_sovereign[local]",
    "kestrel_sovereign[ml]",
    "kestrel_sovereign[voice]",
    "kestrel_sovereign[observability]",
]
# Full installation (everything including test and dev tools)
full = [
    "kestrel_sovereign[all-features]",
    "kestrel_sovereign[test]",
]

[project.scripts]
kestrel = "kestrel_sovereign.cli:main"

[project.entry-points.pytest11]
kestrel = "kestrel_sovereign.testing.fixtures"

[dependency-groups]
dev = [
    {include-group = "test"},
]

# Mirror of [project.optional-dependencies.test] for uv sync compatibility
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.1.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.0.0",
    "asgi-lifespan>=2.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
# Only run Kestrel tests from root - external apps have their own pytest config
testpaths = ["tests"]
norecursedirs = ["scripts", ".venv", "*.egg-info", ".git", "node_modules"]
addopts = "-x --tb=short"
markers = [
    "e2e: marks tests as end-to-end (slow)",
    "integration: marks tests as integration tests",
    "load: Load/stress tests (opt-in with --run-load)",
    "adversarial: Security/bypass attempt tests for constitutional protections",
    "dual_backend: Tests that run on both SQLite and PostgreSQL",
    "cloud_resource: Tests that use cloud resources (RunPod, GPU, etc)",
    "docker: Tests that require Docker",
    "docker_mcp: Tests that require Docker MCP Toolkit (excluded in CI)",
    "slow: Slow-running tests",
    "anyio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["kestrel_sovereign"]

[tool.hatch.build.targets.sdist]
include = ["kestrel_sovereign/**/*"]

[tool.uv.sources]
kestrel-feature-github = { path = "kestrel-feature-github", editable = true }
